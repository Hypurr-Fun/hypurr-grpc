enum WalletTag {
  WALLET_TAG_UNSPECIFIED = 0;
  WALLET_TAG_ALL = 1;
  WALLET_TAG_MARKET_MAKER = 2;
  WALLET_TAG_WHALE = 3;
  WALLET_TAG_SMART_TRADER = 4;
  WALLET_TAG_LEADERBOARD = 5;
  WALLET_TAG_RETAIL = 6;
  WALLET_TAG_PRO_TERMINAL = 7;
  WALLET_TAG_HIGH_WIN_RATE = 8;
  WALLET_TAG_LOW_WIN_RATE = 9;
  WALLET_TAG_LONG_TERM_HOLDER = 10;
}

enum TradeDirOverride {
  TRADE_DIR_OVERRIDE_UNSPECIFIED = 0;
  TRADE_DIR_OVERRIDE_A = 1;
  TRADE_DIR_OVERRIDE_B = 2;
}

message WalletFilter {
  repeated string wallet_addresses = 1;
  bytes bloom_filter = 2;
  WalletTag tag = 3;
  repeated WalletTag included_tags = 4;
  repeated WalletTag excluded_tags = 5;
}

message TradeSideInfo {
  string user = 1;                          // user
  string start_pos = 2;                     // start_pos
  int64 oid = 3;                            // oid
  google.protobuf.UInt64Value twap_id = 4;  // twap_id (nullable interface)
  google.protobuf.StringValue cloid = 5;    // cloid (nullable string)
}

message WalletTrade {
  string coin = 1;                           // Perp symbol or @ notation
  string side = 2;                           // A or B
  string time = 3;                           // Timestamp in nanoseconds
  string px = 4;                             // Price
  string sz = 5;                             // Size
  string hash = 6;                           // Hash (string to be safe)
  TradeDirOverride trade_dir_override = 7;   // enum
  repeated TradeSideInfo side_info = 8;      // side_info[]
}

message WalletMovement {
}

message WalletMovementsRequest {
  string wallet_address = 1;
}

message WalletMovementsResponse {
  string wallet_address = 1;
  repeated WalletMovement wallet_movements = 2;
}

message WalletSpotBalance {
  int64 token = 1;
  double balance = 2;
  double cost = 3;
  double delta = 4;
}

message WalletPerpBalance {
  int64 instrument = 1;
  double balance = 2;
  double cost = 3;
  double funding = 4;
  double liquidation_price = 5;
  double leverage = 6;
  google.protobuf.DoubleValue isolated_margin = 7;
}

message WalletBalancesRequest {
  string wallet_address = 1;
}

message WalletBalancesResponse {
  string wallet_address = 1;
  repeated WalletSpotBalance spot_balances = 2;
  repeated WalletPerpBalance perp_balances = 3;
}

message WalletTradesStreamRequest {
  repeated string wallet_addresses = 1;
  bytes bloom_filter = 2;
}

message WalletTradesStreamResponse {
  string wallet_address = 1;
  repeated WalletTrade trades = 2;
}

message AggregatedWalletPositioningStreamRequest {
  WalletFilter filter = 1;
  uint64 instrument_id = 2;
  bool detailed = 3;
}

message AggregatedWalletPositioningStreamResponse {
  AggregatedWalletPositioningSummary summary = 1;
  repeated WalletPositioning wallet_positions = 2;
}

message WalletPositioning {
  string wallet_address = 1;
  WalletPerpBalance perp_balance = 2;
  WalletSpotBalance spot_balance = 3;
}

message AggregatedWalletPositioningSummary {
  uint64 wallet_short_count = 1;
  WalletPerpBalance aggregated_short_balance = 2;
  uint64 wallet_long_count = 3;
  WalletPerpBalance aggregated_long_balance = 4;
  uint64 wallet_hold_count = 5;
  WalletSpotBalance aggregated_hold_balance = 6;
}

message WalletBalancesStreamRequest {
  bytes bloom_filter = 1;
}

message WalletBalancesStreamResponse {
  string wallet_address = 1;
  repeated WalletSpotBalance spot_balances = 2;
  repeated WalletPerpBalance perp_balances = 3;
  string reason = 4;
}

message ValidatorDelegatorsRequest {
  string validator_address = 1;
}

message ValidatorDelegatorsResponse {
  repeated ValidatorDelegator delegators = 1;
}

message ValidatorDelegator {
  string wallet_address = 1;
  double stake = 2;
}

message ReferrerWalletRequest {
  string referrer_code = 1;
}

message ReferrerWalletResponse {
  string wallet_address = 1;
}

message WalletTagsRequest {
  string wallet_address = 1;
}

message WalletTagsResponse {
  repeated WalletTag tags = 1;
}

message WalletInfo {
  string address = 1;
  double perp_equity = 2;
  double spot_equity = 3;
}

message WalletsByTagRequest {
  WalletTag tag = 1;
  google.protobuf.Int64Value limit = 2;
}

message WalletsByTagResponse {
  repeated WalletInfo wallet_infos = 1;
}

message WalletsByFilterRequest {
  WalletFilter filter = 1;
  google.protobuf.Int64Value limit = 2;
}

message WalletsByFilterResponse {
  repeated WalletInfo wallet_infos = 1;
}

message AggregatedWalletLiquidationsRequest {
  repeated string wallet_addresses = 1;
  bytes bloom_filter = 2;
  WalletTag tag = 3;
  uint64 instrument_id = 4;
  bool detailed = 5;
}

message AggregatedWalletLiquidationsResponse {
  repeated WalletLiquidationGroup wallet_liquidation_groups = 1;
}

message WalletLiquidationGroup {
  uint64 total_liquidation_count = 1;
  double total_position_value = 2;
  double from_price = 3;
  double to_price = 4;
  repeated WalletLiquidation wallet_liquidations = 5;
}

message WalletLiquidation {
  string wallet_address = 1;
  double position_value = 2;
  double entry_price = 3;
  double liquidation_price = 4;
}

// Sampling step for the liquidation map: only snapshots whose timestamp is a
// multiple of the step are returned (alignment is relative to the unix epoch;
// 1 month = 30 days). Snapshots are stored once per minute, so 1M returns
// every snapshot.
enum LiquidationStep {
  LIQUIDATION_STEP_UNSPECIFIED = 0; // server treats as 1M (every snapshot)
  LIQUIDATION_STEP_1M = 1;
  LIQUIDATION_STEP_3M = 2;
  LIQUIDATION_STEP_5M = 3;
  LIQUIDATION_STEP_15M = 4;
  LIQUIDATION_STEP_30M = 5;
  LIQUIDATION_STEP_1H = 6;
  LIQUIDATION_STEP_2H = 7;
  LIQUIDATION_STEP_4H = 8;
  LIQUIDATION_STEP_8H = 9;
  LIQUIDATION_STEP_12H = 10;
  LIQUIDATION_STEP_1D = 11;
  LIQUIDATION_STEP_3D = 12;
  LIQUIDATION_STEP_1W = 13;
  LIQUIDATION_STEP_1MO = 14;
}

message LiquidationsRequest {
  uint64 instrument_id = 1;
  int64 from_ts = 2; // unix seconds, inclusive
  int64 to_ts = 3;   // unix seconds, exclusive
  LiquidationStep step = 4;
}

message LiquidationsResponse {
  repeated LiquidationSnapshot snapshots = 1; // snapshot_ts ascending
}

message LiquidationSnapshot {
  int64 snapshot_ts = 1;
  double mark_price = 2;
  repeated LiquidationBand bands = 3; // bucket ascending = price ascending
}

message LiquidationBand {
  int32 bucket = 1; // signed 0.1%-of-mark distance band: -n = long side (n bands below mark), +n = short side (above); |n|=1 touches mark
  double notional = 2;
  uint32 count = 3;
}

enum MetricInterval {
  METRIC_INTERVAL_UNSPECIFIED = 0; // server treats as DAY
  METRIC_INTERVAL_HOUR = 1;
  METRIC_INTERVAL_DAY = 2;
  METRIC_INTERVAL_WEEK = 3;
}

// One time bucket of performance, for the whole account OR one instrument.
// Identical fields regardless of interval or scope.
message PerformanceBucket {
  int64  ts = 1; // bucket start, unix seconds (UTC day/hour/week boundary)

  // --- PnL ---
  double realized_pnl = 2; // realized within this bucket (closed trades)
  double unrealized_pnl = 3; // absolute MTM unrealized of open positions at bucket close
  double period_pnl = 4; // this bucket's total contribution = realized_pnl + Δunrealized
  double cum_pnl = 5; // cumulative total PnL (realized+unrealized) through bucket close

  // --- Win rate ---
  int32  wins = 6; // closed trades resolved in bucket with pnl > 0
  int32  losses = 7; // closed trades resolved in bucket with pnl <= 0
  double cum_win_rate = 8; // cumulative win rate through this bucket, [0,1]
}

// Aggregate over the requested window (from_ts..to_ts; 0/0 = all-time).
message PerformanceSummary {
  double realized_pnl = 1;
  double unrealized_pnl = 2;
  double total_pnl = 3; // realized + unrealized
  int32  wins = 4;
  int32  losses = 5;
  double win_rate = 6; // wins / (wins + losses), [0,1]
}

message InstrumentPerformance {
  uint64 instrument_id = 1; // app convention: perp = index, spot = index + 10000
  double realized_pnl = 2;
  double unrealized_pnl = 3;
  double total_pnl = 4;
  int32  wins = 5;
  int32  losses = 6;
  double win_rate = 7; // [0,1]
}

// ----- RPC 1: aggregates (totals + per-instrument list) -----
message WalletPerformanceRequest {
  string wallet_address = 1;
  int64  from_ts = 2; // inclusive, unix seconds; 0 = all-time
  int64  to_ts = 3; // inclusive, unix seconds; 0 = now
}
message WalletPerformanceResponse {
  string wallet_address = 1;
  PerformanceSummary account = 2; // total PnL + total win rate
  repeated InstrumentPerformance instruments = 3; // per-instrument win rate + all-time PnL
}

// ----- RPC 2: time series (calendar + graphs) -----
message WalletPerformanceSeriesRequest {
  string wallet_address = 1;
  int64  from_ts = 2;
  int64  to_ts = 3;
  MetricInterval interval = 4;            // default DAY
  optional uint64 instrument_id = 5;        // unset = whole account; set = filter to instrument
}
message WalletPerformanceSeriesResponse {
  string wallet_address = 1;
  MetricInterval interval = 2;
  optional uint64 instrument_id = 3;   // echoes the filter
  repeated PerformanceBucket buckets = 4;   // ascending by ts
}

// One time bucket of aggregated positioning for wallets carrying a given tag,
// on a single instrument. Same "bucket" shape philosophy as PerformanceBucket.
message PositioningBucket {
  int64 ts = 1;              // bucket start, unix seconds (UTC interval boundary)

  // --- Net / gross position in BASE units (coin), at bucket close ---
  // net = Σ long sizes − Σ short sizes across the tagged wallets.
  double net_position = 2; // signed: > 0 net long, < 0 net short
  double long_position = 3; // gross long size (≥ 0)
  double short_position = 4; // gross short size (≥ 0, magnitude)

  // --- Same, in USD NOTIONAL (size × mark at bucket close) ---
  double net_notional = 5;
  double long_notional = 6;
  double short_notional = 7;

  // --- Crowding context: distinct wallets on each side at bucket close ---
  uint32 long_wallets = 8;
  uint32 short_wallets = 9;
}

message WalletPositioningSeriesRequest {
  uint64 instrument_id = 1; // perp = index, spot = index + 10000
  WalletFilter filter = 2; // e.g. WHALE; ALL for everyone
  int64 from_ts = 3; // inclusive, unix seconds; 0 = all-time
  int64 to_ts = 4; // inclusive, unix seconds; 0 = now
  hypercore.MetricInterval interval = 5; // default HOUR (for charting overlays)
}

message WalletPositioningSeriesResponse {
  uint64 instrument_id = 1;
  hypercore.WalletTag tag = 2;
  hypercore.MetricInterval interval = 3;
  repeated PositioningBucket buckets = 4; // ascending by ts
}

message SpotInstrumentsRequest {}

message SpotToken {
  int32  index        = 1;  // spot asset index
  string name         = 2;  // token symbol, e.g. "PURR"
  int32  sz_decimals  = 3;
  int32  wei_decimals = 4;
  string full_name    = 5;  // empty when unset
  string deployer     = 6;
  string deploy_time  = 7;
}

message SpotInstrument {
  int64     id              = 1;  // spot pair id
  string    name            = 2;  // e.g. "PURR/USDC" or "@1"
  SpotToken base            = 3;
  SpotToken quote           = 4;
  double    last_price      = 5;
  int64     last_trade_time = 6;  // nanoseconds
}

message SpotInstrumentsResponse {
  repeated SpotInstrument instruments = 1;
}

message PerpInstrumentsRequest {}

message PerpInstrument {
  int64  id              = 1;   // instrument id (encodes dex + asset index)
  string name            = 2;
  string dex             = 3;   // dex symbol; empty for the main perp dex
  int32  sz_decimals     = 4;
  bool   only_isolated   = 5;
  string margin_mode     = 6;
  int32  margin_table_id = 7;
  int32  max_leverage    = 8;
  double last_price      = 9;
  double mark_price      = 10;
  int64  last_trade_time = 11;  // nanoseconds
}

message PerpInstrumentsResponse {
  repeated PerpInstrument instruments = 1;
}

// ----- Wallets classified on a metric percentile band -----
enum ClassificationMetric {
  CLASSIFICATION_METRIC_UNSPECIFIED  = 0;
  CLASSIFICATION_METRIC_TOTAL_PNL    = 1; // sum of daily PnL (realized + Δunrealized) over the frame
  CLASSIFICATION_METRIC_WIN_RATE     = 2; // wins / closed trades within the frame, [0,1]
  CLASSIFICATION_METRIC_MAX_DRAWDOWN = 3; // largest drawdown within the frame
}

message WalletsByMetricPercentileRequest {
  ClassificationMetric metric = 1;
  int64  from_ts           = 2; // inclusive, unix seconds, UTC day-aligned
  int64  to_ts             = 3; // exclusive, unix seconds, UTC day-aligned
  double from_percentile   = 4; // 0-100, band inclusive both ends, ranked ascending by value:
  double to_percentile     = 5; //   worst 1% = [0,1], top 1% = [99,100]
  int32  min_closed_trades = 6; // WIN_RATE only: exclude wallets with fewer closed trades in frame (0 = server default)
  int32  limit             = 7; // max wallets returned (0 = server default; server-capped)
}

message WalletMetricRank {
  string wallet_address = 1;
  double value          = 2; // aggregated metric value over the frame
  double percent_rank   = 3; // [0,100], ascending by value
}

message WalletsByMetricPercentileResponse {
  repeated WalletMetricRank wallets = 1; // ascending by percent_rank
}

// ----- Historical wallet trades over a time frame (paged) -----
enum WalletTradeType {
  WALLET_TRADE_TYPE_ALL  = 0; // request only: perp + spot merged
  WALLET_TRADE_TYPE_PERP = 1;
  WALLET_TRADE_TYPE_SPOT = 2;
}

// One side of a persisted trade. Like TradeSideInfo but with the stored
// integer start position (wei) instead of the raw string.
message HistoricalTradeSide {
  string user      = 1;
  int64  start_pos = 2;                     // wei
  int64  oid       = 3;
  google.protobuf.UInt64Value twap_id = 4;
  google.protobuf.StringValue cloid   = 5;
}

// Mirrors the indexer's persisted trade row (sizes/fee in raw wei).
message HistoricalWalletTrade {
  WalletTradeType type   = 1;               // PERP or SPOT
  uint64 timestamp       = 2;               // unix nanoseconds
  string hash            = 3;
  string custom_hash     = 4;               // deterministic row id, unique per wallet
  uint64 instrument_id   = 5;               // app convention: perp = index, spot = index + 10000
  uint64 from_id         = 6;
  int64  from_size       = 7;               // wei
  uint64 to_id           = 8;
  int64  to_size         = 9;               // wei
  int64  fee             = 10;              // quote wei
  TradeDirOverride trade_dir_override = 11;
  HistoricalTradeSide ask_side = 12;
  HistoricalTradeSide bid_side = 13;
  int64 realized_pnl     = 14;              // USDC wei; realized PnL of this fill (perp only; 0 for spot / non-reducing fills)
}

message WalletTradesRequest {
  string wallet_address = 1;
  int64  from_ts        = 2; // inclusive, unix seconds; 0 = earliest
  int64  to_ts          = 3; // inclusive, unix seconds; 0 = now
  WalletTradeType type  = 4; // ALL = perp + spot merged
  int32  page_size      = 5; // max 2000; 0 = 2000
  string page_token     = 6; // from previous response; empty = first page
  repeated int64 asset_ids = 7; // same convention as HistoricalWalletTrade.instrument_id: perp = index, spot = index + 10000; empty = no filter
}

message WalletTradesResponse {
  string wallet_address                 = 1;
  repeated HistoricalWalletTrade trades = 2; // timestamp descending
  string next_page_token                = 3; // empty when exhausted
}

message OHLCRequest {
  int64  instrument_id = 1; // same convention as HistoricalWalletTrade.instrument_id: perp = index, spot = index + 10000
  string interval      = 2; // "15m" | "1h" | "4h" | "1d" | "1w"
  int64  from_ts       = 3; // inclusive, unix seconds; 0 = earliest
  int64  to_ts         = 4; // inclusive, unix seconds; 0 = now
}

message OHLC {
  int64  open_time = 1; // bucket start, unix seconds
  double open      = 2;
  double high      = 3;
  double low       = 4;
  double close     = 5;
}

message OHLCResponse {
  repeated OHLC ohlc = 1; // open_time ascending
}

message HighLowRequest {
  int64 instrument_id = 1; // same convention as CandlesRequest.instrument_id
  int64 from_ts       = 2; // inclusive, unix seconds; 0 = earliest
  int64 to_ts         = 3; // inclusive, unix seconds; 0 = now
}

message HighLowResponse {
  double high = 1; // max traded price in range; 0 = no trades
  double low  = 2; // min traded price in range; 0 = no trades
}

service HyperCore {
  rpc WalletMovements(WalletMovementsRequest) returns (WalletMovementsResponse) {}
  rpc WalletBalances(WalletBalancesRequest) returns (WalletBalancesResponse) {}
  rpc AggregatedWalletPositioningStream(AggregatedWalletPositioningStreamRequest) returns (stream AggregatedWalletPositioningStreamResponse) {}
  rpc AggregatedWalletLiquidations(AggregatedWalletLiquidationsRequest) returns (AggregatedWalletLiquidationsResponse) {}
  rpc Liquidations(LiquidationsRequest) returns (LiquidationsResponse) {}
  rpc WalletBalancesStream(stream WalletBalancesStreamRequest) returns (stream WalletBalancesStreamResponse) {}
  rpc WalletTradesStream(WalletTradesStreamRequest) returns (stream WalletTradesStreamResponse) {}
  rpc ValidatorDelegators(ValidatorDelegatorsRequest) returns (ValidatorDelegatorsResponse) {}
  rpc ReferrerWallet(ReferrerWalletRequest) returns (ReferrerWalletResponse) {}
  rpc WalletTags(WalletTagsRequest) returns (WalletTagsResponse) {}
  rpc WalletsByTag(WalletsByTagRequest) returns (WalletsByTagResponse) {}
  rpc WalletsByFilter(WalletsByFilterRequest) returns (WalletsByFilterResponse) {}
  rpc WalletPerformance(WalletPerformanceRequest) returns (WalletPerformanceResponse) {}
  rpc WalletPerformanceSeries(WalletPerformanceSeriesRequest) returns (WalletPerformanceSeriesResponse) {}
  rpc WalletPositioningSeries(WalletPositioningSeriesRequest) returns (WalletPositioningSeriesResponse) {}
  rpc SpotInstruments(SpotInstrumentsRequest) returns (SpotInstrumentsResponse);
  rpc PerpInstruments(PerpInstrumentsRequest) returns (PerpInstrumentsResponse);
  rpc WalletsByMetricPercentile(WalletsByMetricPercentileRequest) returns (WalletsByMetricPercentileResponse) {}
  rpc WalletTrades(WalletTradesRequest) returns (WalletTradesResponse) {}
  rpc OHLC(OHLCRequest) returns (OHLCResponse) {}
  rpc HighLow(HighLowRequest) returns (HighLowResponse) {}
}

