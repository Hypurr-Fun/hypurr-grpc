enum WalletTag {
  WALLET_TAG_UNSPECIFIED = 0;
  WALLET_TAG_ALL = 1;
  WALLET_TAG_MARKET_MAKER = 2;
  WALLET_TAG_WHALE = 3;
  WALLET_TAG_SMART_TRADER = 4;
  WALLET_TAG_LEADERBOARD = 5;
  WALLET_TAG_RETAIL = 6;
  WALLET_TAG_PRO_TERMINAL = 7;
}

enum TradeDirOverride {
  TRADE_DIR_OVERRIDE_UNSPECIFIED = 0;
  TRADE_DIR_OVERRIDE_A = 1;
  TRADE_DIR_OVERRIDE_B = 2;
}

message TradeSideInfo {
  string user = 1;                          // user
  string start_pos = 2;                     // start_pos
  int64 oid = 3;                            // oid
  google.protobuf.UInt64Value twap_id = 4;  // twap_id (nullable interface)
  google.protobuf.StringValue cloid = 5;    // cloid (nullable string)
}

message WalletTrade {
  string coin = 1;                           // Perp symbol or @ notation
  string side = 2;                           // A or B
  string time = 3;                           // Timestamp in nanoseconds
  string px = 4;                             // Price
  string sz = 5;                             // Size
  string hash = 6;                           // Hash (string to be safe)
  TradeDirOverride trade_dir_override = 7;   // enum
  repeated TradeSideInfo side_info = 8;      // side_info[]
}

message WalletMovement {
}

message WalletMovementsRequest {
  string wallet_address = 1;
}

message WalletMovementsResponse {
  string wallet_address = 1;
  repeated WalletMovement wallet_movements = 2;
}

message WalletSpotBalance {
  int64 token = 1;
  double balance = 2;
  double cost = 3;
  double delta = 4;
}

message WalletPerpBalance {
  int64 instrument = 1;
  double balance = 2;
  double cost = 3;
  double funding = 4;
  double liquidation_price = 5;
  double leverage = 6;
  google.protobuf.DoubleValue isolated_margin = 7;
}

message WalletBalancesRequest {
  string wallet_address = 1;
}

message WalletBalancesResponse {
  string wallet_address = 1;
  repeated WalletSpotBalance spot_balances = 2;
  repeated WalletPerpBalance perp_balances = 3;
}

message WalletTradesStreamRequest {
  repeated string wallet_addresses = 1;
  bytes bloom_filter = 2;
}

message WalletTradesStreamResponse {
  string wallet_address = 1;
  repeated WalletTrade trades = 2;
}

message AggregatedWalletPositioningStreamRequest {
  repeated string wallet_addresses = 1;
  bytes bloom_filter = 2;
  WalletTag tag = 3;
  uint64 instrument_id = 4;
  bool detailed = 5;
}

message AggregatedWalletPositioningStreamResponse {
  AggregatedWalletPositioningSummary summary = 1;
  repeated WalletPositioning wallet_positions = 2;
}

message WalletPositioning {
  string wallet_address = 1;
  WalletPerpBalance perp_balance = 2;
  WalletSpotBalance spot_balance = 3;
}

message AggregatedWalletPositioningSummary {
  uint64 wallet_short_count = 1;
  WalletPerpBalance aggregated_short_balance = 2;
  uint64 wallet_long_count = 3;
  WalletPerpBalance aggregated_long_balance = 4;
  uint64 wallet_hold_count = 5;
  WalletSpotBalance aggregated_hold_balance = 6;
}

message WalletBalancesStreamRequest {
  bytes bloom_filter = 1;
}

message WalletBalancesStreamResponse {
  string wallet_address = 1;
  repeated WalletSpotBalance spot_balances = 2;
  repeated WalletPerpBalance perp_balances = 3;
  string reason = 4;
}

message ValidatorDelegatorsRequest {
  string validator_address = 1;
}

message ValidatorDelegatorsResponse {
  repeated ValidatorDelegator delegators = 1;
}

message ValidatorDelegator {
  string wallet_address = 1;
  double stake = 2;
}

message ReferrerWalletRequest {
  string referrer_code = 1;
}

message ReferrerWalletResponse {
  string wallet_address = 1;
}

message WalletTagsRequest {
  string wallet_address = 1;
}

message WalletTagsResponse {
  repeated WalletTag tags = 1;
}

message WalletInfo {
  string address = 1;
  double perp_equity = 2;
  double spot_equity = 3;
}

message WalletsByTagRequest {
  WalletTag tag = 1;
}

message WalletsByTagResponse {
  repeated WalletInfo wallet_infos = 1;
}

message AggregatedWalletLiquidationsRequest {
  repeated string wallet_addresses = 1;
  bytes bloom_filter = 2;
  WalletTag tag = 3;
  uint64 instrument_id = 4;
  bool detailed = 5;
}

message AggregatedWalletLiquidationsResponse {
  repeated WalletLiquidationGroup wallet_liquidation_groups = 1;
}

message WalletLiquidationGroup {
  uint64 total_liquidation_count = 1;
  double total_position_value = 2;
  double from_price = 3;
  double to_price = 4;
  repeated WalletLiquidation wallet_liquidations = 5;
}

message WalletLiquidation {
  string wallet_address = 1;
  double position_value = 2;
  double entry_price = 3;
  double liquidation_price = 4;
}

message WalletMetricsRequest {
  string wallet_address = 1;
  int64 from_ts = 2;  // inclusive, unix seconds
  int64 to_ts = 3;    // inclusive, unix seconds
}

message WalletMetricsResponse {
  string wallet_address = 1;
  repeated WalletDailyMetric daily = 2;
  repeated WalletHourlyMetric hourly = 3;
}

message WalletInstrumentMetricsRequest {
  string wallet_address = 1;
  int64 from_ts = 2;  // inclusive, unix seconds
  int64 to_ts = 3;    // inclusive, unix seconds
  uint64 instrument_id = 4;
}

message WalletInstrumentMetricsResponse {
  string wallet_address = 1;
  repeated WalletInstrumentHourlyMetric instrument_hourly = 2;
}

// WalletDailyMetric mirrors one wallet_daily_metrics row.
message WalletDailyMetric {
  int64 day_ts = 1;
  double daily_pnl = 2;
  double cum_pnl = 3;
  double peak_cum_pnl = 4;
  double max_drawdown = 5;
}

// WalletHourlyMetric mirrors one wallet_hourly_metrics row.
message WalletHourlyMetric {
  int64 hour_ts = 1;
  double realized_pnl = 2;
  double unrealized_delta = 3;
  double net_exposure = 4;
  double intra_low_pnl = 5;
}

// WalletInstrumentHourlyMetric mirrors one wallet_instrument_hourly_pnl row.
message WalletInstrumentHourlyMetric {
  uint64 instrument_id = 1;
  int64 hour_ts = 2;
  double realized_pnl = 3;
  double unrealized_pnl = 4;
  double end_size = 5;
  double end_cost = 6;
}

service HyperCore {
  rpc WalletMovements(WalletMovementsRequest) returns (WalletMovementsResponse) {}
  rpc WalletBalances(WalletBalancesRequest) returns (WalletBalancesResponse) {}
  rpc AggregatedWalletPositioningStream(AggregatedWalletPositioningStreamRequest) returns (stream AggregatedWalletPositioningStreamResponse) {}
  rpc AggregatedWalletLiquidations(AggregatedWalletLiquidationsRequest) returns (AggregatedWalletLiquidationsResponse) {}
  rpc WalletBalancesStream(stream WalletBalancesStreamRequest) returns (stream WalletBalancesStreamResponse) {}
  rpc WalletTradesStream(WalletTradesStreamRequest) returns (stream WalletTradesStreamResponse) {}
  rpc ValidatorDelegators(ValidatorDelegatorsRequest) returns (ValidatorDelegatorsResponse) {}
  rpc ReferrerWallet(ReferrerWalletRequest) returns (ReferrerWalletResponse) {}
  rpc WalletTags(WalletTagsRequest) returns (WalletTagsResponse) {}
  rpc WalletsByTag(WalletsByTagRequest) returns (WalletsByTagResponse) {}
  rpc WalletMetrics(WalletMetricsRequest) returns (WalletMetricsResponse) {}
  rpc WalletInstrumentMetrics(WalletInstrumentMetricsRequest) returns (WalletInstrumentMetricsResponse) {}
}

