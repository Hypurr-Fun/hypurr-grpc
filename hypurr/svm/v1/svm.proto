syntax = "proto3";
package hypurr.svm.v1;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr/svm/v1;svmv1";

import "google/protobuf/timestamp.proto";

// SvmWalletService stores the caller's SVM (ed25519) wallets, e.g. for Fogo
// or Solana. Keys are custodial and encrypted like Hyperliquid wallet keys.
// Storage and signing only: no chain RPC, indexing or balances. Private keys
// are never returned; SignSvmTransaction signs whitelisted transactions with
// them. There is no raw message signing: a raw signature can authorize any
// transaction, including transfers.
//
// Identifiers are stable: SvmWallet.id is a generic wallet id (one id space
// with Hyperliquid wallets, kept when wallets become chain-agnostic) and
// public_key is the wallet's svm account address. A future chain-agnostic
// wallet API maps them as Wallet.id and the address of its "svm" account; a
// wallet has at most one svm account, so wallet_id names the signer.
//
// Every call needs the caller's own JWT: ListSvmWallets wallet:read, wallet
// changes wallet:write, SignSvmTransaction trade:write. Wallet API keys
// (bound to one Hyperliquid wallet) are refused with PERMISSION_DENIED. A
// wallet id the caller does not own is NOT_FOUND.
service SvmWalletService {
  // The caller's wallets, oldest first.
  rpc ListSvmWallets(ListSvmWalletsRequest) returns (ListSvmWalletsResponse);
  // A new wallet with a keypair generated by the server.
  rpc CreateSvmWallet(CreateSvmWalletRequest) returns (CreateSvmWalletResponse);
  // Stores a wallet from its secret key. A key already stored is rebound to
  // the caller under the new name, keeping its id.
  rpc ImportSvmWallet(ImportSvmWalletRequest) returns (ImportSvmWalletResponse);
  rpc RenameSvmWallet(RenameSvmWalletRequest) returns (RenameSvmWalletResponse);
  // Unbinds the wallet from the caller; importing its key again restores it.
  rpc DeleteSvmWallet(DeleteSvmWalletRequest) returns (DeleteSvmWalletResponse);
  // Ed25519 signature of a transaction message, given only when every
  // instruction in it is whitelisted. Today that is the Chronicles game
  // program acting on the wallet's own accounts to delegate gameplay to a
  // session key: SetSession, CreateCharacter followed by SetSession, and
  // CreatePlayerAccounts; plus ComputeBudget instructions. The wallet must be
  // a signer and may not be the fee payer. Anything else (System or token
  // transfers, other programs, address lookup tables, another wallet's
  // accounts) is PERMISSION_DENIED.
  rpc SignSvmTransaction(SignSvmTransactionRequest) returns (SignSvmTransactionResponse);
}

message SvmWallet {
  // Generic wallet id, never reused by a Hyperliquid wallet.
  int64 id = 1;
  // 3 to 128 letters, digits or "/", as for Hyperliquid wallets.
  string name = 2;
  // Base58 ed25519 public key: the wallet's address and stable external
  // identifier.
  string public_key = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListSvmWalletsRequest {}

message ListSvmWalletsResponse {
  repeated SvmWallet wallets = 1;
}

message CreateSvmWalletRequest {
  string name = 1;
}

message CreateSvmWalletResponse {
  SvmWallet wallet = 1;
}

message ImportSvmWalletRequest {
  string name = 1;
  // Base58 64-byte keypair (seed then public key, as Solana wallets export
  // it) or 32-byte seed.
  string secret_key = 2;
}

message ImportSvmWalletResponse {
  SvmWallet wallet = 1;
}

message RenameSvmWalletRequest {
  int64 wallet_id = 1;
  string name = 2;
}

message RenameSvmWalletResponse {
  SvmWallet wallet = 1;
}

message DeleteSvmWalletRequest {
  int64 wallet_id = 1;
}

message DeleteSvmWalletResponse {}

message SignSvmTransactionRequest {
  int64 wallet_id = 1;
  // The serialized transaction message (legacy or v0), the bytes the
  // transaction's signatures cover: web3.js Transaction.serializeMessage()
  // or VersionedMessage.serialize(). At most 1232 bytes.
  bytes message = 2;
}

message SignSvmTransactionResponse {
  // 64-byte ed25519 signature.
  bytes signature = 1;
  // Base58 public key of the signer.
  string public_key = 2;
}
