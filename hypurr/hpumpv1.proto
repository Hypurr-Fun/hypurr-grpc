syntax = "proto3";

package hypurr;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr";

import "hypurr/common.proto";

// HPump Launch Token messages
message HpumpV1Launch {
  string address = 1;          // token address is unique
  string symbol = 2;
  string name = 3;
  string dev_address = 4;
  string description = 5;
  int64 dev_telegram_id = 6;
  int64 created_at = 7;        // block timestamp
  string launch_id = 8;        // the uint256 id from the event (using string for big integers)
  string base_reserve = 9;      // Using string for big integers
  string quote_reserve = 10;     // Using string for big integers
  string x0 = 11;
  int64 last_sync_timestamp = 12;
  bool graduated = 13;
  int64 graduated_at = 14;      // Timestamp when graduated
  string graduated_to = 15;     // Address of the new token after graduation
  // Dev telegram user
  TelegramUserPublic dev_telegram_user = 16;
}

// HPump Launch Pair Swap messages
message HpumpV1LaunchSwap {
  string id = 1;               // tx hash + log index
  string launch = 2;             // launch pair address
  string sender = 3;
  string origin = 4;
  string to = 5;
  string net_base_amount = 6;
  string net_quote_amount = 7;        // Using string for big integers
  int32 block_number = 8;
  int64 timestamp = 9;
}