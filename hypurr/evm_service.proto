syntax = "proto3";

package hypurr;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr";

import "hypurr/evm.proto";
import "google/protobuf/wrappers.proto";
import "hypurr/common.proto";

message ERC20TokenRequest {
  string address = 1;
}

message ERC20TokenResponse {
  ERC20Token token = 1;
}

message ERC20TokensRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ERC20TokensResponse {
  repeated ERC20Token tokens = 1;
  string next_page_token = 2;
}

message UniV2PairRequest {
  string address = 1;
}

message UniV2PairResponse {
  UniV2Pair pair = 1;
}

message UniPairsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string token_address = 3;
}

message UniPairsResponse {
  repeated UniV2Pair pairs_v2 = 1;
  repeated UniV3Pool pairs_v3 = 2;
  string next_page_token = 3;
}

message UniV2SwapRequest {
  string id = 1;
}

message UniV2SwapResponse {
  UniV2Swap swap = 1;
}

message UniV2SwapsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string pair_address = 3;
  string sender_address = 4;
  string receiver_address = 5;
}

message UniV2SwapsResponse {
  repeated UniV2Swap swaps = 1;
  string next_page_token = 2;
}

message ERC20TransferEventsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string token_address = 3;
  string from_address = 4;
  string to_address = 5;
}

message ERC20TransferEventsResponse {
  repeated ERC20TransferEvent events = 1;
  string next_page_token = 2;
}

message ERC20ApprovalEventsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string token_address = 3;
  string owner_address = 4;
  string spender_address = 5;
}

message ERC20ApprovalEventsResponse {
  repeated ERC20ApprovalEvent events = 1;
  string next_page_token = 2;
}

message UniCandlesRequest {
  string pair_address = 1;
  int64 from_timestamp = 2;
  int64 to_timestamp = 3;
  string interval = 4;  // e.g. "5m", "1h", "1d"
}

message UniCandlesResponse {
  repeated UniCandle candles = 1;
}

// V3 Swap request/response messages
message UniV3SwapRequest {
  string id = 1;
}

message UniV3SwapResponse {
  UniV3Swap swap = 1;
}

message UniV3SwapsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string pool_address = 3;
  string sender_address = 4;
  string recipient_address = 5;
}

message UniV3SwapsResponse {
  repeated UniV3Swap swaps = 1;
  string next_page_token = 2;
}

message UniV2SwapStreamRequest {
  string pair_address = 1;
  google.protobuf.Int32Value limit = 2;
}

message UniV2SwapStreamResponse {
  repeated UniV2Swap swaps = 1;
}

message UniV3SwapStreamRequest {
  string pool_address = 1;
  google.protobuf.Int32Value limit = 2;
}

message UniV3SwapStreamResponse {
  repeated UniV3Swap swaps = 1;
}

message ERC20AccountBalancesRequest {
  string address = 1;
}

message ERC20AccountBalancesResponse {
  repeated ERC20AccountBalance account_balances = 1;
}

// HPump V1 Launch Token request/response messages
message HpumpV1LaunchTokenRequest {
  string address = 1;
}

message HpumpV1LaunchTokenResponse {
  HpumpV1LaunchToken token = 1;
}

message HpumpV1LaunchTokensRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool graduated_only = 3;
}

message HpumpV1LaunchTokensResponse {
  repeated HpumpV1LaunchToken tokens = 1;
  string next_page_token = 2;
}

// HPump V1 Launch Pair request/response messages
message HpumpV1LaunchPairRequest {
  string address = 1;
}

message HpumpV1LaunchPairResponse {
  HpumpV1LaunchPair pair = 1;
}

message HpumpV1LaunchPairsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string token_address = 3;
}

message HpumpV1LaunchPairsResponse {
  repeated HpumpV1LaunchPair pairs = 1;
  string next_page_token = 2;
}

// HPump V1 Swap request/response messages
message HpumpV1LaunchPairSwapRequest {
  string id = 1;
}

message HpumpV1LaunchPairSwapResponse {
  HpumpV1LaunchPairSwap swap = 1;
}

message HpumpV1LaunchPairSwapsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string pair_address = 3;
  string origin_address = 4;
  string to_address = 5;
}

message HpumpV1LaunchPairSwapsResponse {
  repeated HpumpV1LaunchPairSwap swaps = 1;
  string next_page_token = 2;
}

// HPump V1 Swap streaming request/response messages
message HpumpV1LaunchPairSwapStreamRequest {
  string pair_address = 1;
  google.protobuf.Int32Value limit = 2;
}

message HpumpV1LaunchPairSwapStreamResponse {
  repeated HpumpV1LaunchPairSwap swaps = 1;
}

message HpumpV1CandlesRequest {
  string pair_address = 1;
  int64 from_timestamp = 2;
  int64 to_timestamp = 3;
  string interval = 4;  // e.g. "5m", "1h", "1d"
}

message HpumpV1CandlesResponse {
  repeated UniCandle candles = 1;
}


service EVM {
  // Token related endpoints
  rpc ERC20Token(ERC20TokenRequest) returns (ERC20TokenResponse) {}
  rpc ERC20Tokens(ERC20TokensRequest) returns (ERC20TokensResponse) {}
  rpc ERC20AccountBalances (ERC20AccountBalancesRequest) returns (ERC20AccountBalancesResponse) {}

  // Pair related endpoints
  rpc UniV2Pair(UniV2PairRequest) returns (UniV2PairResponse) {}
  rpc UniPairs(UniPairsRequest) returns (UniPairsResponse) {}

  // Swap related endpoints
  rpc UniV2Swap(UniV2SwapRequest) returns (UniV2SwapResponse) {}
  rpc UniV2Swaps(UniV2SwapsRequest) returns (UniV2SwapsResponse) {}
  rpc UniV3Swap(UniV3SwapRequest) returns (UniV3SwapResponse) {}
  rpc UniV3Swaps(UniV3SwapsRequest) returns (UniV3SwapsResponse) {}
  
  // Event related endpoints
  rpc ERC20TransferEvents(ERC20TransferEventsRequest) returns (ERC20TransferEventsResponse) {}
  rpc ERC20ApprovalEvents(ERC20ApprovalEventsRequest) returns (ERC20ApprovalEventsResponse) {}
  
  // Price candle related endpoints
  rpc UniCandles(UniCandlesRequest) returns (UniCandlesResponse) {}

  // Streaming endpoints
  rpc UniV2SwapStream(UniV2SwapStreamRequest) returns (stream UniV2SwapStreamResponse) {}
  rpc UniV3SwapStream(UniV3SwapStreamRequest) returns (stream UniV3SwapStreamResponse) {}

  // HPump V1 related endpoints
  rpc HpumpV1LaunchToken(HpumpV1LaunchTokenRequest) returns (HpumpV1LaunchTokenResponse) {}
  rpc HpumpV1LaunchTokens(HpumpV1LaunchTokensRequest) returns (HpumpV1LaunchTokensResponse) {}
  rpc HpumpV1LaunchPair(HpumpV1LaunchPairRequest) returns (HpumpV1LaunchPairResponse) {}
  rpc HpumpV1LaunchPairs(HpumpV1LaunchPairsRequest) returns (HpumpV1LaunchPairsResponse) {}
  rpc HpumpV1LaunchPairSwap(HpumpV1LaunchPairSwapRequest) returns (HpumpV1LaunchPairSwapResponse) {}
  rpc HpumpV1LaunchPairSwaps(HpumpV1LaunchPairSwapsRequest) returns (HpumpV1LaunchPairSwapsResponse) {}
  
  // HPump V1 streaming endpoint
  rpc HpumpV1LaunchPairSwapStream(HpumpV1LaunchPairSwapStreamRequest) returns (stream HpumpV1LaunchPairSwapStreamResponse) {}

  // Price candle related endpoints
  // Todo group into same type
  rpc HpumpV1(HpumpV1CandlesRequest) returns (HpumpV1CandlesResponse) {}

}