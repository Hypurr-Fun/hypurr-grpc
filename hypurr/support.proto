syntax = "proto3";
package hypurr;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr";
import "google/protobuf/wrappers.proto";


message SupportMessage {
  int64 id = 1;
  int64 conversation_id = 2;
  int64 from_id = 3;
  string sender_type = 4;
  string message = 5;
  google.protobuf.StringValue attachment_url = 6;
  int64 timestamp = 7;
}

message SupportConversation {
  int64 id = 1;
  int64 telegram_id = 2;
  string project_id = 3;
  string source = 4;
  bool closed = 5;
  google.protobuf.Int64Value closed_at = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
}

message SupportTicket {
  int64 id = 1;
  int64 conversation_id = 2;
  string summary = 3;
  bool closed = 4;
  google.protobuf.Int64Value closed_at = 5;
}