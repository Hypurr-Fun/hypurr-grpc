syntax = "proto3";
package hypurr;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr";

service IosService {
  rpc Home(HomeRequest) returns (HomeResponse);
  rpc AssetDetail(AssetDetailRequest) returns (AssetDetailResponse);
  rpc AssetDetailLiveUpdates(AssetDetailLiveUpdatesRequest) returns (stream AssetDetailLiveUpdate);
}

// Color carries both theme variants for a single UI color.
// Expected format: #RRGGBB.
message Color {
  string light_hex = 1; // e.g. "#98FFC0"
  string dark_hex = 2;  // e.g. "#98FFC0"
}

message PortfolioSummarySection {
  // Main card value in cents, e.g. "$22,482.17" -> 2248217.
  // Should be an int value already converted to the app's default currency, currently USD, scaled by 100 for cents.
  int64 total_value_cents = 1; // e.g. 2248217

  // Change badge value, e.g. "+$1,284.35" -> 128435.
  // Signed int value, already converted to the app's default currency, scaled by 100 for cents.
  int64 absolute_change_cents = 2; // e.g. 128400 or -51200

  // Optional for the current design, but useful if the card later shows percentage change.
  // Double value with 2 decimals precision e.g. 11.34 or -35.4
  double percentage_change = 3;

  // Response order is display order.
  // Mobile renders allocation rows and allocation bar segments in this exact order.
  repeated PortfolioAllocation allocations = 4;
}

message HomeRequest {}

message HomeResponse {
  // Accounts summary card data.
  HomeAccountsSummarySection accounts_summary = 1;
  // Portfolio summary card data.
  PortfolioSummarySection portfolio_summary = 2;
  // Recent activity feed, newest first.
  RecentActivitySection recent_activity = 10;
}

message HomeAccountsSummarySection {
  // Sum across all accounts, USD cents.
  int64 total_balance_cents = 1;
  // 24-hour change, window-agnostic naming. e.g. 6.0 = +6%.
  // Double value with 2 decimals precision e.g. 11.34 or -35.4
  double change_percentage = 2;
  repeated HomeAccountSummary accounts = 3;
}

message HomeAccountSummary {
  string wallet_id = 1;
  string name = 2;
  string address = 3;
  // Account balance in cents e.g. "$22,482.17" -> 2248217.
  int64 balance_cents = 4;
  // 24-hour change, window-agnostic naming. e.g. 6.0 = +6%.
  // Double value with 2 decimals precision e.g. 11.34 or -35.4
  double change_percentage = 5;
}

message RecentActivitySection {
  repeated ActivityItem items = 1;
}

enum PositionDirection {
  POSITION_DIRECTION_UNSPECIFIED = 0;
  POSITION_DIRECTION_LONG = 1;
  POSITION_DIRECTION_SHORT = 2;
}

message ActivityItem {
  // Stable unique id, e.g. "spot:<tradeID>", "perp:<tradeID>", "evmswap:<id>".
  string id = 1;
  // RFC3339 UTC timestamp.
  string occurred_at = 2;
  oneof activity {
    SwapActivity swap = 10;
    PositionActivity position = 11;
    ClosePositionActivity close_position = 12;
    SendActivity send = 13;
    InternalTransferActivity internal_transfer = 14;
    ReceiveActivity receive = 15;
  }
}

message SwapActivity {
  string from_asset_symbol = 1;
  string from_asset_logo_url = 2;
  string to_asset_symbol = 3;
  string to_asset_logo_url = 4;
  string from_token_amount = 5;
  string to_token_amount = 6;
}

message PositionActivity {
  PositionDirection direction = 1;
  string asset_symbol = 2;
  string asset_logo_url = 3;
  string token_amount = 4;
  // Notional of the fill in cents e.g. "$22,482.17" -> 2248217.
  int64 cost_cents = 5;
}

message ClosePositionActivity {
  PositionDirection direction = 1;
  string asset_symbol = 2;
  string asset_logo_url = 3;
  string token_amount = 4;
  // Signed realized PnL in cents e.g. "$22,482.17" -> 2248217 or "-$22,482.17" -> -2248217.
  int64 realized_pnl_cents = 5;
}

message SendActivity {
  string recipient = 1;
  // Absolute USD value in cents e.g. "$22,482.17" -> 2248217.
  int64 amount_cents = 2;
}

message InternalTransferActivity {
  string destination = 1;
  // Absolute USD value in cents e.g. "$22,482.17" -> 2248217.
  int64 amount_cents = 2;
}

message ReceiveActivity {
  string from = 1;
  // Absolute USD value in cents e.g. "$22,482.17" -> 2248217.
  int64 amount_cents = 2;
}

enum AssetDetailChartPeriod {
  ASSET_DETAIL_CHART_PERIOD_UNSPECIFIED = 0; // treated as 1D
  ASSET_DETAIL_CHART_PERIOD_1D = 1;
  ASSET_DETAIL_CHART_PERIOD_1W = 2;
  ASSET_DETAIL_CHART_PERIOD_1M = 3;
  ASSET_DETAIL_CHART_PERIOD_6M = 4;
  ASSET_DETAIL_CHART_PERIOD_1Y = 5;
  ASSET_DETAIL_CHART_PERIOD_MAX = 6;
}

message AssetDetailRequest {
  // Hyperliquid asset id, same convention as PortfolioAllocation.asset_id:
  // < 10000 = perp index, >= 10000 = spot pair (10000 + spot index).
  uint64 asset_id = 1;
  AssetDetailChartPeriod chart_period = 2;
}

message AssetDetailLiveUpdatesRequest {
  uint64 asset_id = 1;
}

message AssetDetailResponse {
  AssetDetailMetadata metadata = 1;
  AssetDetailPriceSummary price = 2;
  AssetDetailChart chart = 3;
  AssetDetailOverview overview = 4;
}

// Append-only live update for the active 1D view: mobile appends a new price
// point to the 1D chart and refreshes the hero price / market cap or open interest display.
message AssetDetailLiveUpdate {
  // RFC3339 UTC timestamp.
  string occurred_at = 1;
  // Asset price with asset decimal precision e.g. "$22,482.17" -> "22482.17" or "$0.00017" -> "0.00017"
  string price_decimal = 2;
  oneof valuation {
    // Market cap of the spot asset in cents e.g. "$22,482.17" -> 2248217.
    int64 market_cap_cents = 3;
    // Open interest of the perp in cents, same encoding.
    int64 open_interest_cents = 4;
  }
}

message AssetDetailMetadata {
  string symbol = 1;     // e.g. "HFUN"
  string name = 2;       // e.g. "Hypurr Fun"
  string venue_name = 3; // e.g. "Hyperliquid"
  string logo_url = 4;
}

// Decimal strings for prices accommodate sub-cent valuations.
message AssetDetailPriceSummary {
  // Asset price with asset decimal precision e.g. "$22,482.17" -> "22482.17" or "$0.00017" -> "0.00017"
  string price_decimal = 1;
  // Signed change over the asset detail price period with asset decimal precision e.g. "$100.04" -> "100.04" or "$0.000001" -> "0.000001"
  string absolute_change_decimal = 2;
  // Change over asset detail price period, window-agnostic naming. e.g. 6.0 = +6%.
  // Double value with 2 decimals precision e.g. 11.34 or -35.4
  double change_percentage = 3;
  oneof valuation {
    // Market cap of the spot instrument in cents e.g. "$22,482.17" -> 2248217.
    int64 market_cap_cents = 4;
    // Open interest of the perp in cents, same encoding.
    int64 open_interest_cents = 5;
  }
}

message AssetDetailChart {
  AssetDetailChartPeriod period = 1;
  // Response order is display order, oldest point first.
  repeated AssetDetailChartPoint points = 2;
  // Candle interval for this chart period, in seconds. Mobile uses this
  // to bucket live updates onto the same time axis as the initial chart.
  int64 candle_interval_seconds = 3;
}

message AssetDetailChartPoint {
  string id = 1;
  // RFC3339 UTC timestamp.
  string occurred_at = 2;
  // Asset price with asset decimal precision e.g. "$22,482.17" -> "22482.17" or "$0.00017" -> "0.00017"
  string price_decimal = 3;
}

// Statistics values are display-formatted by the backend (e.g. "$1.2B").
// Fields with no backend data source are empty; mobile falls back locally.
message AssetDetailOverview {
  oneof overview {
    AssetDetailPerpOverview perp = 1;
    AssetDetailSpotOverview spot = 2;
  }
}

message AssetDetailPerpOverview {
  // 24-hour trading volume with single decimal precision, e.g. "$1.2B".
  string volume_24h = 1;
  // Current hourly funding on the instrument in %, positive means longs pay shorts, e.g. "0.0012%" or "-0.001%"
  string funding = 2;
  // All-time high price with up to asset decimals precision, e.g. "237.49" or "0.0001"
  string all_time_high = 3;
  // The max leverage for the asset, e.g. "10x" or "3x"
  string max_leverage = 4;
  // Plain-text asset description.
  string description = 5;
  // Plain-text asset category.
  string category = 6;
}

message AssetDetailSpotOverview {
  // 24-hour trading volume with single decimal precision, e.g. "$1.2B".
  string volume_24h = 1;
  // Number of holders with single decimal precision, e.g. "12.5K".
  string holders = 2;
  // Fully diluted valuation with single decimal precision, e.g. "$4.5B".
  string fdv = 3;
  // All-time high price with up to asset decimals precision, e.g. "237.49" or "0.0001"
  string all_time_high = 4;
  // Plain-text asset description.
  string description = 5;
}

message PortfolioAllocation {
  // Asset id from Hyperliquid: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api/asset-ids.
  string asset_id = 1;

  // Display name shown in the row, e.g. "HFUN", "ETH", "USDC".
  string name = 2;

  // Row value, e.g. "$12.4K" -> 1240000.
  // Should be a decimal value already converted to the app's default currency, currently USD, scaled by 100 for cents.
  int64 value_cents = 3; // e.g. 1240000

  // Row percentage and allocation bar segment width, e.g. 51.
  // Mobile can calculate this from value / total_value, but backend-provided values avoid rounding mismatch.
  // Double value with 2 decimals precision e.g. 11.34 or -35.4
  double percentage = 4;

  // Dot color and matching allocation bar segment color (light + dark variants).
  Color color = 5;
}