syntax = "proto3";
package hypurr;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr";

service IosService {
  rpc Home(HomeRequest) returns (HomeResponse);
  rpc LiveAssetUpdates(LiveAssetUpdatesRequest) returns (stream LiveAssetUpdate);
  rpc AssetDetail(AssetDetailRequest) returns (AssetDetailResponse);
  rpc AssetDetailLiveUpdates(AssetDetailLiveUpdatesRequest) returns (stream AssetDetailLiveUpdate);
  rpc AssetMetadataCatalog(AssetMetadataCatalogRequest) returns (AssetMetadataCatalogResponse);
  rpc Accounts(AccountsRequest) returns (AccountsResponse);
  rpc Profile(ProfileRequest) returns (ProfileResponse);
  rpc UserStream(UserStreamRequest) returns (stream UserSnapshot);
}

// ==== Shared ====

message WalletReference {
  string wallet_id = 1;
  string name = 2;
}

// Color carries both theme variants for a single UI color.
// Expected format: #RRGGBB.
message Color {
  string light_hex = 1; // e.g. "#98FFC0"
  string dark_hex = 2;  // e.g. "#98FFC0"
}

// Shared asset identity used by the catalog and profile positions.
message Asset {
  // Stable Hyperliquid/backend asset id used for navigation.
  // Same convention as asset detail: perp = pair id, spot = 10000 + spot index.
  // 0 = not navigable.
  uint64 asset_id = 1;

  string symbol = 2; // e.g. "HFUN"
  string name = 3;   // e.g. "Hypurr Fun"

  // Full remote image URL. Mobile owns fallback if empty.
  string logo_url = 4;

  Color color = 5;
}

// ==== Home ====

message HomeRequest {}

message HomeResponse {
  // Accounts summary card data.
  HomeAccountsSummarySection accounts_summary = 1;
  // Portfolio summary card data.
  PortfolioSummarySection portfolio_summary = 2;
  // Recent activity feed, newest first.
  RecentActivitySection recent_activity = 10;
}

message HomeAccountsSummarySection {
  // Sum across all accounts, USD cents.
  int64 total_balance_cents = 1;
  // 24-hour change, window-agnostic naming. e.g. 6.0 = +6%.
  // Double value with 2 decimals precision e.g. 11.34 or -35.4
  double change_percentage = 2;
  repeated HomeAccountSummary accounts = 3;
}

message HomeAccountSummary {
  string wallet_id = 1;
  string name = 2;
  string address = 3;
  // Account balance in cents e.g. "$22,482.17" -> 2248217.
  int64 balance_cents = 4;
  // 24-hour change, window-agnostic naming. e.g. 6.0 = +6%.
  // Double value with 2 decimals precision e.g. 11.34 or -35.4
  double change_percentage = 5;
}

message PortfolioSummarySection {
  // Main card value in cents, e.g. "$22,482.17" -> 2248217.
  // Should be an int value already converted to the app's default currency, currently USD, scaled by 100 for cents.
  int64 total_value_cents = 1; // e.g. 2248217

  // Change badge value, e.g. "+$1,284.35" -> 128435.
  // Signed int value, already converted to the app's default currency, scaled by 100 for cents.
  int64 absolute_change_cents = 2; // e.g. 128400 or -51200

  // Optional for the current design, but useful if the card later shows percentage change.
  // Double value with 2 decimals precision e.g. 11.34 or -35.4
  double percentage_change = 3;

  // Response order is display order.
  // Mobile renders allocation rows and allocation bar segments in this exact order.
  repeated PortfolioAllocation allocations = 4;
}

message PortfolioAllocation {
  // Asset id from Hyperliquid: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api/asset-ids.
  string asset_id = 1;

  // Display name shown in the row, e.g. "HFUN", "ETH", "USDC".
  string name = 2;

  // Row value, e.g. "$12.4K" -> 1240000.
  // Should be a decimal value already converted to the app's default currency, currently USD, scaled by 100 for cents.
  int64 value_cents = 3; // e.g. 1240000

  // Row percentage and allocation bar segment width, e.g. 51.
  // Mobile can calculate this from value / total_value, but backend-provided values avoid rounding mismatch.
  // Double value with 2 decimals precision e.g. 11.34 or -35.4
  double percentage = 4;

  // Dot color and matching allocation bar segment color (light + dark variants).
  Color color = 5;
}

message RecentActivitySection {
  repeated ActivityItem items = 1;
}

enum PositionDirection {
  POSITION_DIRECTION_UNSPECIFIED = 0;
  POSITION_DIRECTION_LONG = 1;
  POSITION_DIRECTION_SHORT = 2;
}

message ActivityItem {
  // Stable unique id, e.g. "spot:<tradeID>", "perp:<tradeID>", "evmswap:<id>".
  string id = 1;
  // RFC3339 UTC timestamp.
  string occurred_at = 2;
  oneof activity {
    SwapActivity swap = 10;
    PositionActivity position = 11;
    ClosePositionActivity close_position = 12;
    SendActivity send = 13;
    InternalTransferActivity internal_transfer = 14;
    ReceiveActivity receive = 15;
  }
}

message SwapActivity {
  string from_asset_symbol = 1;
  string from_asset_logo_url = 2;
  string to_asset_symbol = 3;
  string to_asset_logo_url = 4;
  string from_token_amount = 5;
  string to_token_amount = 6;
}

message PositionActivity {
  PositionDirection direction = 1;
  string asset_symbol = 2;
  string asset_logo_url = 3;
  string token_amount = 4;
  // Notional of the fill in cents e.g. "$22,482.17" -> 2248217.
  int64 cost_cents = 5;
}

message ClosePositionActivity {
  PositionDirection direction = 1;
  string asset_symbol = 2;
  string asset_logo_url = 3;
  string token_amount = 4;
  // Signed realized PnL in cents e.g. "$22,482.17" -> 2248217 or "-$22,482.17" -> -2248217.
  int64 realized_pnl_cents = 5;
}

message SendActivity {
  string recipient = 1;
  // Absolute USD value in cents e.g. "$22,482.17" -> 2248217.
  int64 amount_cents = 2;
}

message InternalTransferActivity {
  string destination = 1;
  // Absolute USD value in cents e.g. "$22,482.17" -> 2248217.
  int64 amount_cents = 2;
}

message ReceiveActivity {
  string from = 1;
  // Absolute USD value in cents e.g. "$22,482.17" -> 2248217.
  int64 amount_cents = 2;
}

// ==== LiveAssetUpdates ====

message LiveAssetUpdatesRequest {}

message LiveAssetUpdate {
  // Asset affected by this update.
  uint64 asset_id = 1;

  // RFC3339 UTC time at which this asset update occurred.
  string occurred_at = 2;

  oneof update {
    AssetPriceUpdate price = 10;
  }
}

message AssetPriceUpdate {
  // Asset price with asset decimal precision e.g. "$22,482.17" -> "22482.17" or "$0.00017" -> "0.00017"
  string price_decimal = 1;
}

// ==== AssetDetail ====

enum AssetDetailChartPeriod {
  ASSET_DETAIL_CHART_PERIOD_UNSPECIFIED = 0; // treated as 1D
  ASSET_DETAIL_CHART_PERIOD_1D = 1;
  ASSET_DETAIL_CHART_PERIOD_1W = 2;
  ASSET_DETAIL_CHART_PERIOD_1M = 3;
  ASSET_DETAIL_CHART_PERIOD_6M = 4;
  ASSET_DETAIL_CHART_PERIOD_1Y = 5;
  ASSET_DETAIL_CHART_PERIOD_MAX = 6;
}

message AssetDetailRequest {
  // Hyperliquid asset id, same convention as PortfolioAllocation.asset_id:
  // < 10000 = perp index, >= 10000 = spot pair (10000 + spot index).
  uint64 asset_id = 1;
  AssetDetailChartPeriod chart_period = 2;
}

message AssetDetailResponse {
  Asset metadata = 1;
  AssetDetailPriceSummary price = 2;
  AssetDetailChart chart = 3;
  AssetDetailOverview overview = 4;
}

// Decimal strings for prices accommodate sub-cent valuations.
message AssetDetailPriceSummary {
  // Asset price with asset decimal precision e.g. "$22,482.17" -> "22482.17" or "$0.00017" -> "0.00017"
  string price_decimal = 1;
  // Signed change over the asset detail price period with asset decimal precision e.g. "$100.04" -> "100.04" or "$0.000001" -> "0.000001"
  string absolute_change_decimal = 2;
  // Change over asset detail price period, window-agnostic naming. e.g. 6.0 = +6%.
  // Double value with 2 decimals precision e.g. 11.34 or -35.4
  double change_percentage = 3;
  oneof valuation {
    // Market cap of the spot instrument in cents e.g. "$22,482.17" -> 2248217.
    int64 market_cap_cents = 4;
    // Open interest of the perp in cents, same encoding.
    int64 open_interest_cents = 5;
  }
}

message AssetDetailChart {
  AssetDetailChartPeriod period = 1;
  // Response order is display order, oldest point first.
  repeated AssetDetailChartPoint points = 2;
  // Candle interval for this chart period, in seconds. Mobile uses this
  // to bucket live updates onto the same time axis as the initial chart.
  int64 candle_interval_seconds = 3;
}

message AssetDetailChartPoint {
  string id = 1;
  // RFC3339 UTC timestamp.
  string occurred_at = 2;
  // Asset price with asset decimal precision e.g. "$22,482.17" -> "22482.17" or "$0.00017" -> "0.00017"
  string price_decimal = 3;
}

// Statistics values are display-formatted by the backend (e.g. "$1.2B").
// Fields with no backend data source are empty; mobile falls back locally.
message AssetDetailOverview {
  oneof overview {
    AssetDetailPerpOverview perp = 1;
    AssetDetailSpotOverview spot = 2;
  }
}

message AssetDetailPerpOverview {
  // 24-hour trading volume with single decimal precision, e.g. "$1.2B".
  string volume_24h = 1;
  // Current hourly funding on the instrument in %, positive means longs pay shorts, e.g. "0.0012%" or "-0.001%"
  string funding = 2;
  // All-time high price with up to asset decimals precision, e.g. "237.49" or "0.0001"
  string all_time_high = 3;
  // The max leverage for the asset, e.g. "10x" or "3x"
  string max_leverage = 4;
  // Plain-text asset description.
  string description = 5;
  // Plain-text asset category.
  string category = 6;
}

message AssetDetailSpotOverview {
  // 24-hour trading volume with single decimal precision, e.g. "$1.2B".
  string volume_24h = 1;
  // Number of holders with single decimal precision, e.g. "12.5K".
  string holders = 2;
  // Fully diluted valuation with single decimal precision, e.g. "$4.5B".
  string fdv = 3;
  // All-time high price with up to asset decimals precision, e.g. "237.49" or "0.0001"
  string all_time_high = 4;
  // Plain-text asset description.
  string description = 5;
}

// ==== AssetDetailLiveUpdates ====

message AssetDetailLiveUpdatesRequest {
  uint64 asset_id = 1;
}

// Append-only live update for the active 1D view: mobile appends a new price
// point to the 1D chart and refreshes the hero price / market cap or open interest display.
message AssetDetailLiveUpdate {
  // RFC3339 UTC timestamp.
  string occurred_at = 1;
  // Asset price with asset decimal precision e.g. "$22,482.17" -> "22482.17" or "$0.00017" -> "0.00017"
  string price_decimal = 2;
  oneof valuation {
    // Market cap of the spot asset in cents e.g. "$22,482.17" -> 2248217.
    int64 market_cap_cents = 3;
    // Open interest of the perp in cents, same encoding.
    int64 open_interest_cents = 4;
  }
}

// ==== AssetMetadataCatalog ====

message AssetMetadataCatalogRequest {}

message AssetMetadataCatalogResponse {
  // Active/searchable assets. Mobile fetches this on app launch and can filter locally.
  repeated Asset assets = 1;
}

// ==== Accounts ====

message AccountsRequest {}

message AccountsResponse {
  // Sum across all wallets, USD cents.
  int64 total_balance_cents = 1;

  // Signed account change, USD cents.
  // Backend owns the window/meaning; mobile only renders the value.
  int64 change_cents = 2;

  // Response order is display order.
  repeated AccountWallet wallets = 3;
}

message AccountWallet {
  // Stable wallet id for diffing and local expand/collapse state.
  string wallet_id = 1;

  string name = 2;

  // Full address; mobile owns middle truncation.
  string address = 3;

  // Wallet total, USD cents.
  int64 balance_cents = 4;

  // Backend-derived avatar color; fallback/placeholder when image_url is
  // empty or still loading.
  Color color = 5;

  // Display order is cash, perp, spot. A section is absent when the
  // wallet has nothing to show in it.
  CashAccountBalanceSection cash = 6;
  PerpAccountBalanceSection perp = 7;
  SpotAccountBalanceSection spot = 8;

  // Avatar image; empty = no image, show the color avatar.
  string image_url = 9;
}

message CashAccountBalanceSection {
  // Section total, USD cents.
  int64 balance_cents = 1;
}

// ==== Profile ====

enum ProfileChartPeriod {
  PROFILE_CHART_PERIOD_UNSPECIFIED = 0; // treated as 24H
  PROFILE_CHART_PERIOD_24H = 1;
  PROFILE_CHART_PERIOD_7D = 2;
  PROFILE_CHART_PERIOD_30D = 3;
}

message ProfileRequest {
  // Profile owner being viewed, Telegram user id. 0 = the authenticated caller.
  int64 user_id = 1;

  ProfileChartPeriod chart_period = 2;
}

message ProfileResponse {
  ProfileIdentity identity = 1;

  // Absent until the follow feature exists; mobile hides the counts row.
  ProfileSocialSummary social = 2;

  // Trading data is private by default: activity, portfolio and positions
  // are absent when viewing another user's profile.
  ProfileActivitySummary activity = 3;
  ProfilePortfolioSummary portfolio = 4;

  // All currently open positions. Response order is display order.
  repeated ProfilePosition open_positions = 5;

  // First closed-positions page, always ordered by most recent exit: at
  // most the 30 exits within the requested chart period.
  ProfileClosedPositionsResponse recent_closed_positions = 6;
}

message ProfileClosedPositionsResponse {
  // Response order is display order.
  repeated ProfilePosition positions = 1;

  // Empty when there are no more positions. Always empty until the
  // paginated ClosedPositions RPC exists.
  string next_page_token = 2;
}

message ProfileIdentity {
  string display_name = 1; // e.g. "MaGicConch"

  // Handle with the @ prefix, e.g. "@MaGica_Conch".
  string handle = 2;

  // Avatar initials shown in the profile badge, e.g. "MC".
  string initials = 3;

  // Plain-text bio. Empty until profile bios exist; mobile hides the row.
  string bio = 4;

  // Full URL opened when tapping the X badge or handle. Empty until profile
  // links exist; mobile hides the badge.
  string x_url = 5;

  // RFC3339 UTC timestamp of the user's first appearance. Mobile owns
  // presentation formatting, e.g. "Joined January 2026".
  string joined_at = 6;
}

message ProfileSocialSummary {
  int32 following_count = 1;
  int32 followers_count = 2;
}

// Computed over the last 30 days.
message ProfileActivitySummary {
  // Mean round-trip duration in seconds of positions fully closed in the
  // window. Mobile owns compact formatting, e.g. "21h 11m avg. hold".
  int64 average_hold_seconds = 1;

  int32 trade_count = 2;
}

message ProfilePortfolioSummary {
  // Portfolio total in cents, e.g. "$22,482.17" -> 2248217.
  int64 value_cents = 1;

  // Signed USD change over the selected chart period, measured from the
  // first chart point, e.g. 128400 or -51200.
  int64 absolute_change_cents = 2;

  // "Total cash" card: USDC + free perp collateral, USD cents.
  int64 total_cash_cents = 3;

  ProfileChart chart = 4;
}

message ProfileChart {
  ProfileChartPeriod period = 1;

  // Response order is drawing order, oldest point first; the last point is
  // the live portfolio value.
  repeated ProfileChartPoint points = 2;
}

message ProfileChartPoint {
  string id = 1; // bucket open unix seconds, e.g. "1752624000"

  // RFC3339 UTC timestamp.
  string occurred_at = 2;

  // USD portfolio value at this point in cents, e.g. "$6.46" -> 646.
  int64 value_cents = 3;
}

// Open/closed is implied by the containing field (open_positions vs a
// closed-positions page), so there is no status enum.
message ProfilePosition {
  // Stable unique id, e.g. "open:perp:159", "closed:spot:10005:1784100577068".
  string id = 1;

  Asset asset = 2;

  // Token quantity as a decimal string to avoid floating-point precision
  // loss; for closed rows, the exited quantity. Mobile owns display
  // rounding.
  string quantity = 3;

  // Open: current value at mark, USD cents. Closed: exit proceeds, USD
  // cents. e.g. "$22,482.17" -> 2248217.
  int64 market_value_cents = 4;

  // Open: unrealized PnL vs cost basis. Closed: realized PnL of the round
  // trip. Double value with 2 decimals precision e.g. 11.34 or -98.33.
  // Mobile owns color, sign/absolute display, and rounding.
  double change_percentage = 5;
}

message PerpAccountBalanceSection {
  // Section total, USD cents.
  int64 balance_cents = 1;
  int32 open_perps_count = 2;
}

message SpotAccountBalanceSection {
  // Section total, USD cents.
  int64 balance_cents = 1;
  int32 token_count = 2;
}

// ==== UserStream ====

message UserStreamRequest {}

message UserSnapshot {
  // RFC3339 UTC time when the service calculated this consistent snapshot.
  string as_of = 1;

  // Aggregate across every authenticated wallet.
  PortfolioValue all_wallets_value = 2;
  // Wallet selector display order.
  repeated UserWallet wallets = 3;
}

message PortfolioValue {
  int64 total_balance_cents = 1;
  int64 change_cents = 2;       // Signed value for the current product period.
  double change_percentage = 3; // Signed value for the same period.
}

message UserWallet {
  WalletReference wallet = 1;
  PortfolioValue value = 2;

  // Empty arrays mean this wallet has no current holdings or positions.
  // Response order is display order.
  repeated SpotHolding spot_holdings = 3;
  repeated OpenPerpPosition perp_positions = 4;
}

// Shared by Home, Portfolio, Asset Detail, and Trading.
message SpotHolding {
  string position_id = 1; // unique identifier for the position (e.g. "chain:wallet:asset_id" for Hypercore)
  Asset asset = 2;
  string quantity_decimal = 3;
  int64 market_value_cents = 4;
}

// Shared by Home, Portfolio, Asset Detail, and Trading.
message OpenPerpPosition {
  string position_id = 1; // unique identifier for the position (e.g. "chain:wallet:asset_id" for Hypercore)
  string dex = 2;
  Asset asset = 3;
  int32 leverage = 4;
  PerpSide side = 5;
  int64 unrealized_pnl_cents = 6; // Signed value.
  double roe_percent = 7;         // Signed value.

  // Presence means iOS shows a liquidation warning.
  PerpLiquidationWarning liquidation_warning = 8;
}

enum PerpSide {
  PERP_SIDE_LONG = 0;
  PERP_SIDE_SHORT = 1;
}

message PerpLiquidationWarning {
  double distance_percentage = 1;
}
