syntax = "proto3";
package hypurr;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr";

// Kms forwards sealed payloads between the app and the hfun-kms instance;
// the bot cannot read or alter them.
service Kms {
  rpc GetAttestation(KmsGetAttestationRequest) returns (KmsGetAttestationResponse);
  rpc LoginOrRegister(KmsLoginOrRegisterRequest) returns (KmsLoginOrRegisterResponse);
  rpc LoginIntent(KmsLoginIntentRequest) returns (KmsLoginIntentResponse);

  // Routed by the instance JWT.
  rpc AddProvider(KmsAddProviderRequest) returns (KmsAddProviderResponse);
  rpc AccountEnable2FA(KmsAccountEnable2FARequest) returns (KmsAccountEnable2FAResponse);
  rpc AccountDisable2FA(KmsAccountDisable2FARequest) returns (KmsAccountDisable2FAResponse);
  rpc AccountShardSecret(KmsAccountShardSecretRequest) returns (KmsAccountShardSecretResponse);
  rpc AccountSignMessage(KmsAccountSignMessageRequest) returns (KmsAccountSignMessageResponse);
  rpc AccountApproveAgent(KmsAccountApproveAgentRequest) returns (KmsAccountApproveAgentResponse);
  rpc AccountRevokeAgent(KmsAccountRevokeAgentRequest) returns (KmsAccountRevokeAgentResponse);
  rpc GetAccountInfo(KmsGetAccountInfoRequest) returns (KmsGetAccountInfoResponse);
  rpc RequestFactorReset(KmsRequestFactorResetRequest) returns (KmsRequestFactorResetResponse);
  rpc CancelFactorReset(KmsCancelFactorResetRequest) returns (KmsCancelFactorResetResponse);
  rpc ExecuteFactorReset(KmsExecuteFactorResetRequest) returns (KmsExecuteFactorResetResponse);
  rpc RecoverKeys(KmsRecoverKeysRequest) returns (KmsRecoverKeysResponse);

  // Bot JWT.
  rpc CompleteAccountHandoff(KmsCompleteAccountHandoffRequest) returns (KmsCompleteAccountHandoffResponse);
  rpc RequestAgent(KmsRequestAgentRequest) returns (KmsRequestAgentResponse);
}

message KmsGetAttestationRequest {}

message KmsGetAttestationResponse {
  bytes attestation = 1;
}

enum KmsLoginIntentKind {
  KMS_LOGIN_INTENT_KIND_UNSPECIFIED = 0;
  KMS_LOGIN_INTENT_KIND_LOGIN = 1;
  KMS_LOGIN_INTENT_KIND_REGISTER = 2;
}

message KmsLoginIntentRequest {
  string provider = 1; // telegram | google | apple
  string id_token = 2;
}

message KmsLoginIntentResponse {
  KmsLoginIntentKind intent = 1;
}

message KmsLoginOrRegisterRequest {
  bytes encrypted_payload = 1;
  string subject_hash = 2;
}

message KmsLoginOrRegisterResponse {
  bytes attestation = 1;
  // Migrated legacy bot users only, absent otherwise.
  KmsAccountHandoff handoff = 2;
}

// User shard and recovery codes sealed to the device key of this login.
message KmsAccountHandoff {
  bytes user_shard_sealed = 1;
  bytes recovery_codes_sealed = 2;
  // Set instead of the two above when CompleteAccountHandoff is required.
  bool requires_2fa = 3;
}

message KmsCompleteAccountHandoffRequest {
  // The login attestation that reported requires_2fa.
  bytes attestation = 1;
  string two_fa_code = 2;
}

message KmsCompleteAccountHandoffResponse {
  KmsAccountHandoff handoff = 1;
}

message KmsAddProviderRequest {
  bytes encrypted_payload = 1;
  string added_subject_hash = 2;
  string provider_type = 3;
  string instance_jwt = 4;
}

message KmsAddProviderResponse {
  bytes attestation = 1;
}

message KmsAccountEnable2FARequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
}

message KmsAccountEnable2FAResponse {
  bytes attestation = 1;
}

message KmsAccountDisable2FARequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
}

message KmsAccountDisable2FAResponse {
  bytes attestation = 1;
}

message KmsGetAccountInfoRequest {
  string instance_jwt = 1;
}

message KmsGetAccountInfoResponse {
  string account_id = 1;
  repeated KmsProviderInfo providers = 2;
  repeated KmsWalletInfo wallets = 3;
  repeated string two_factor_types = 4;
  repeated KmsAgentInfo agents = 5;
}

message KmsProviderInfo {
  string provider_id = 1;
  string type = 2;
  int64 added_at = 3;
}

message KmsWalletInfo {
  string id = 1; // the key_id of AccountSignMessage
  string type = 2;
  string address = 3;
  int64 added_at = 4;
}

message KmsAgentInfo {
  string agent_id = 1;
  string name = 2;
  int64 expires_at = 3;
  int64 created_at = 4;
}

message KmsAccountShardSecretRequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
}

message KmsAccountShardSecretResponse {
  bytes attestation = 1;
}

message KmsRequestFactorResetRequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
}

message KmsRequestFactorResetResponse {
  bytes attestation = 1;
}

message KmsCancelFactorResetRequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
}

message KmsCancelFactorResetResponse {
  bytes attestation = 1;
}

message KmsExecuteFactorResetRequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
}

message KmsExecuteFactorResetResponse {
  bytes attestation = 1;
}

message KmsRecoverKeysRequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
}

message KmsRecoverKeysResponse {
  bytes attestation = 1;
}

message KmsAccountSignMessageRequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
}

message KmsAccountSignMessageResponse {
  bytes attestation = 1;
}

message KmsRequestAgentRequest {
  repeated string wallet_addresses = 1;
}

message KmsRequestAgentResponse {
  bytes public_key = 1; // 33-byte compressed secp256k1
}

message KmsAccountApproveAgentRequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
}

message KmsAccountApproveAgentResponse {
  bytes attestation = 1;
  string agent_id = 2;
}

message KmsAccountRevokeAgentRequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
}

message KmsAccountRevokeAgentResponse {
  bytes attestation = 1;
}
