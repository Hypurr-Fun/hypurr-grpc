syntax = "proto3";
package hypurr;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr";

// Kms forwards sealed client payloads between the app and the hfun-kms
// instance. The bot is a dumb pipe: payloads are sealed to the enclave,
// responses are attestation documents the client verifies against its own
// pinned trust anchors — nothing here can be read or altered in transit.
service Kms {
  // GetAttestation returns a fresh enclave attestation — the start of every
  // client ceremony (single-use nonce + ephemeral sealing key).
  rpc GetAttestation(KmsGetAttestationRequest) returns (KmsGetAttestationResponse);
  // LoginOrRegister forwards a sealed login/register payload. Pre-auth by
  // nature; on success the bot links the KMS account to an Hfun user using
  // the verified response, never client input.
  rpc LoginOrRegister(KmsLoginOrRegisterRequest) returns (KmsLoginOrRegisterResponse);

  // Account-routed mutations. Authenticated with the KMS bot-JWT (bearer
  // metadata); the bot derives the account id from the VERIFIED claims —
  // never from client input.
  rpc AddProvider(KmsAddProviderRequest) returns (KmsAddProviderResponse);
  rpc AccountEnable2FA(KmsAccountEnable2FARequest) returns (KmsAccountEnable2FAResponse);
  rpc AccountDisable2FA(KmsAccountDisable2FARequest) returns (KmsAccountDisable2FAResponse);
  rpc AccountShardSecret(KmsAccountShardSecretRequest) returns (KmsAccountShardSecretResponse);

  // Locked-out flows: no bot JWT exists; routed by the plaintext
  // subject_hash like LoginOrRegister. Auth lives inside the sealed payload
  // and is enforced by the enclave.
  rpc RequestFactorReset(KmsRequestFactorResetRequest) returns (KmsRequestFactorResetResponse);
  rpc CancelFactorReset(KmsCancelFactorResetRequest) returns (KmsCancelFactorResetResponse);
  rpc ExecuteFactorReset(KmsExecuteFactorResetRequest) returns (KmsExecuteFactorResetResponse);
  rpc RecoverKeys(KmsRecoverKeysRequest) returns (KmsRecoverKeysResponse);

  // Custodial -> KMS migration, 2FA cohort only: when the login response set
  // migration.requires_2fa, the app re-sends THAT login attestation plus the
  // legacy bot TOTP to receive the sealed wallet keys. Stateless: the bot
  // re-verifies the attestation and seals to the device key attested inside
  // it, so a replayed attestation yields keys only the victim's device can
  // open.
  rpc CompleteMigrationRelease(KmsCompleteMigrationReleaseRequest) returns (KmsCompleteMigrationReleaseResponse);
}

message KmsGetAttestationRequest {}

message KmsGetAttestationResponse {
  bytes attestation = 1;
}

message KmsLoginOrRegisterRequest {
  bytes encrypted_payload = 1;
  string subject_hash = 2;
}

message KmsLoginOrRegisterResponse {
  bytes attestation = 1;
  // Set when a legacy custodial bot account was detected for this telegram
  // identity (custodial -> KMS migration). Absent otherwise.
  KmsMigrationRelease migration = 2;
}

// One legacy wallet key, CMS-sealed to the enclave-attested device key of
// THIS login. The app unseals and escrows it via AccountShardSecret.
message KmsSealedWalletKey {
  string address = 1;
  bytes sealed_secret = 2;
}

message KmsMigrationRelease {
  // Sealed keys, present unless requires_2fa is set.
  repeated KmsSealedWalletKey wallets = 1;
  // The legacy account has bot-side 2FA: call CompleteMigrationRelease with
  // the login attestation + TOTP to get the wallets.
  bool requires_2fa = 2;
  // Telegram-first onboarding: migration must be completed before the app
  // proceeds (product-enforced).
  bool forced = 3;
}

message KmsCompleteMigrationReleaseRequest {
  // The attestation from the KmsLoginOrRegisterResponse that reported
  // requires_2fa. Must still be within the verifier freshness window.
  bytes attestation = 1;
  string two_fa_code = 2;
}

message KmsCompleteMigrationReleaseResponse {
  repeated KmsSealedWalletKey wallets = 1;
}

message KmsAddProviderRequest {
  bytes encrypted_payload = 1;
  // Plaintext routing for the instance's uniqueness checks; the enclave
  // independently verifies them against the sealed payload.
  string added_subject_hash = 2;
  string provider_type = 3;
  string instance_jwt = 4;
  // Proof of possession: raw r||s P-256 signature over
  // sha256(encrypted_payload) by the session device key. Forwarded blindly;
  // the KMS instance verifies it.
  bytes signature = 5;
}

message KmsAddProviderResponse {
  bytes attestation = 1;
}

message KmsAccountEnable2FARequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
  // Proof of possession: raw r||s P-256 signature over
  // sha256(encrypted_payload) by the session device key. Forwarded blindly;
  // the KMS instance verifies it.
  bytes signature = 3;
}

message KmsAccountEnable2FAResponse {
  bytes attestation = 1;
}

message KmsAccountDisable2FARequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
  // Proof of possession: raw r||s P-256 signature over
  // sha256(encrypted_payload) by the session device key. Forwarded blindly;
  // the KMS instance verifies it.
  bytes signature = 3;
}

message KmsAccountDisable2FAResponse {
  bytes attestation = 1;
}

message KmsAccountShardSecretRequest {
  bytes encrypted_payload = 1;
  string instance_jwt = 2;
  // Proof of possession: raw r||s P-256 signature over
  // sha256(encrypted_payload) by the session device key. Forwarded blindly;
  // the KMS instance verifies it.
  bytes signature = 3;
}

message KmsAccountShardSecretResponse {
  bytes attestation = 1;
}

message KmsRequestFactorResetRequest {
  bytes encrypted_payload = 1;
  string subject_hash = 2;
}

message KmsRequestFactorResetResponse {
  bytes attestation = 1;
}

message KmsCancelFactorResetRequest {
  bytes encrypted_payload = 1;
  string subject_hash = 2;
}

message KmsCancelFactorResetResponse {
  bytes attestation = 1;
}

message KmsExecuteFactorResetRequest {
  bytes encrypted_payload = 1;
  string subject_hash = 2;
}

message KmsExecuteFactorResetResponse {
  bytes attestation = 1;
}

message KmsRecoverKeysRequest {
  bytes encrypted_payload = 1;
  string subject_hash = 2;
}

message KmsRecoverKeysResponse {
  bytes attestation = 1;
}
