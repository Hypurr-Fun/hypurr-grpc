syntax = "proto3";
package hypurr.ios.v2;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr/ios/v2;iosv2";

service IosService {
  rpc Home(HomeRequest) returns (HomeResponse);
  rpc LiveAssetUpdates(LiveAssetUpdatesRequest) returns (stream AssetTicks);
  rpc Catalog(CatalogRequest) returns (CatalogResponse);
  rpc AssetDetail(AssetDetailRequest) returns (AssetDetailResponse);
  rpc AssetDetailLiveUpdates(AssetDetailLiveUpdatesRequest) returns (stream MarketTick);
  rpc Candles(CandlesRequest) returns (.hypurr.ios.v2.Candles);
  rpc UserStream(UserStreamRequest) returns (stream UserSnapshot);
}

// ==== Shared ====

// Color carries both theme variants for a single UI color.
// Expected format: #RRGGBB.
message Color {
  string light_hex = 1; // e.g. "#98FFC0"
  string dark_hex = 2;  // e.g. "#98FFC0"
}

enum AssetClass {
  ASSET_CLASS_UNSPECIFIED = 0;
  ASSET_CLASS_CRYPTO = 1;
  ASSET_CLASS_STABLE = 2;
  ASSET_CLASS_EQUITY = 3;
  ASSET_CLASS_COMMODITY = 4;
  ASSET_CLASS_FX = 5;
  ASSET_CLASS_INDEX = 6;
}

// Tier 1. An exposure: BTC. The same for the BTC perp, the UBTC book and a WBTC balance.
message Asset {
  // Registry asset id.
  uint32 asset_id = 1;
  string symbol = 2; // e.g. "BTC"
  string name = 3;   // e.g. "Bitcoin"
  // Full remote image URL. Mobile owns fallback if empty.
  string logo_url = 4;
  Color color = 5;
  AssetClass class = 6;
  // True until a curator has confirmed it. Provisional assets are shown
  // like any other but never merged with anything by the app.
  bool provisional = 7;
}

enum TokenRepresentation {
  TOKEN_REPRESENTATION_UNSPECIFIED = 0;
  TOKEN_REPRESENTATION_NATIVE = 1;    // HYPE on Hypercore, native PUMP
  TOKEN_REPRESENTATION_BRIDGED = 2;   // UBTC (Unit), USDT0
  TOKEN_REPRESENTATION_WRAPPED = 3;   // WBTC, WHYPE
  TOKEN_REPRESENTATION_CANONICAL = 4; // USDC on Arbitrum
}

// Tier 2. A token on a chain: what a wallet holds and what a swap moves.
message Token {
  // Registry chain-asset id. 0 for a long-tail token with no registry row;
  // then `ref` is the identity.
  uint64 token_id = 1;
  // Stable string identity for every token, registered or not:
  // "chain:hypercore:0x8f25…" (native id) or "chain:hyperevm:0x9fdb…" (address).
  string ref = 2;
  string chain = 3;  // "hypercore", "hyperevm"
  string symbol = 4; // the token's own: "UBTC"
  string name = 5;   // "Unit Bitcoin"
  string logo_url = 6;
  Color color = 7;
  TokenRepresentation representation = 8;
  string issuer = 9; // "unit", "usdt0"; empty for native
  // The exposure this token is a representation of. Absent for a token no
  // curator has mapped; the app then treats the token as its own thing.
  Asset asset = 10;
  // The spot book that prices this token. Absent when unpriced. Check
  // presence, not zero: market id 0 is a valid market.
  optional uint64 spot_market_id = 11;
}

enum MarketKind {
  MARKET_KIND_UNSPECIFIED = 0;
  MARKET_KIND_SPOT = 1;
  MARKET_KIND_PERP = 2;
  MARKET_KIND_POOL = 3;
}

// Tier 3. An instrument on a venue: what a position is in and an order is placed on.
message Market {
  // Registry security id. Equals the Hyperliquid pair id: perp index,
  // 10000 + spot index, 100000 + 10000 * dex index + index for HIP-3.
  uint64 market_id = 1;
  MarketKind kind = 2;
  string venue = 3;           // "hyperliquid"
  string segment = 4;         // HIP-3 dex: "xyz"; empty on the native dex
  string symbol = 5;          // display: "BTC-PERP", "UBTC/USDC", "xyz:TSLA"
  string standard_symbol = 6; // "HYP:PERP:BTC/USDC", "HYP:xyz:PERP:TSLA/USDC"
  // Units of the underlying per contract: 1000 for kPEPE, else 1. Order
  // sizes and position quantities are in contracts.
  double multiplier = 7;
  // The exposure. Always present for a registered market.
  Asset asset = 8;
  // Spot and pool: the token delivered. Absent for a perp.
  Token base = 9;
  // Quote token for spot and pool; margin token for a perp.
  Token quote = 10;
  string logo_url = 11;
  Color color = 12;
}

// A market with its current price. Used wherever a list of markets is shown.
message MarketQuote {
  Market market = 1;
  // Same format as HomeMarketPrice.price_decimal.
  string price_decimal = 2;
  // Change over the last 24 hours, e.g. 6.0 = +6%.
  double change_percentage = 3;
  oneof valuation {
    int64 market_cap_cents = 4;    // spot
    int64 open_interest_cents = 5; // perp
    int64 liquidity_cents = 6;     // pool
  }
}

enum PositionDirection {
  POSITION_DIRECTION_UNSPECIFIED = 0;
  POSITION_DIRECTION_LONG = 1;
  POSITION_DIRECTION_SHORT = 2;
}

// ==== Home ====

message HomeRequest {
  // Empty means all wallets. This scopes recent_activity only.
  string wallet_id = 1;
}

message HomeResponse {
  RecentActivitySection recent_activity = 1;
  repeated HomeMarketCategory market_categories = 2;
}

message HomeMarketCategory {
  // Stable backend/config identifier for diffing and analytics.
  string id = 1;
  // Backend-configured display title.
  string title = 2;
  // Backend-configured display order.
  repeated HomeMarketPrice assets = 3;
}

message HomeMarketPrice {
  // The price is the one of the asset's reference market.
  Asset asset = 1;
  // Required, unformatted base-10 decimal string.
  // No currency symbol, grouping, rounding, or floating-point conversion.
  // Examples: "114321.5", "0.00017".
  string price_decimal = 2;
  // Exactly 12 points, oldest first: Home's fixed 24h, 2-hour series.
  repeated AssetPricePoint history = 3;
}

message AssetPricePoint {
  string occurred_at = 1;   // RFC3339 UTC.
  string price_decimal = 2; // Same format as HomeMarketPrice.price_decimal.
}

message ActivityTokenAmount {
  Token token = 1;
  string quantity_decimal = 2;
}

message HfunUser {
  int64 user_id = 1;
  string handle = 2;
  string avatar_url = 3;
}

message ActivityParty {
  oneof identity {
    HfunUser hfun_user = 1; // Only with a verified wallet-to-user link.
    string wallet_address = 2;
  }
}

message RecentActivitySection {
  repeated ActivityItem items = 1; // At most three, newest first.
}

message ActivityItem {
  string id = 1;
  string occurred_at = 2; // RFC3339 UTC.
  oneof activity {
    DepositActivity deposit = 10;
    WithdrawActivity withdraw = 11;
    SendActivity send = 12;
    ReceiveActivity receive = 13;
    AccountClassTransferActivity account_class_transfer = 14;
    SpotFillActivity spot_fill = 15;
    OpenPerpActivity open_perp = 16;
    ClosePerpActivity close_perp = 17;
    LiquidationActivity liquidation = 19;
    GenesisAllocationActivity genesis_allocation = 20;
    SwapActivity swap = 21;
  }
}

message DepositActivity {
  ActivityTokenAmount received = 1;
  int64 usd_value_cents = 2;
}

message WithdrawActivity {
  ActivityTokenAmount sent = 1;
  int64 usd_value_cents = 2;
}

message SendActivity {
  ActivityParty recipient = 1;
  ActivityTokenAmount sent = 2;
  int64 usd_value_cents = 3;
}

message ReceiveActivity {
  ActivityParty sender = 1;
  ActivityTokenAmount received = 2;
  int64 usd_value_cents = 3;
}

enum AccountClass {
  ACCOUNT_CLASS_UNSPECIFIED = 0;
  ACCOUNT_CLASS_SPOT = 1;
  ACCOUNT_CLASS_PERPS = 2;
}

message AccountClassTransferActivity {
  AccountClass destination = 1;
  string usdc_amount_decimal = 2;
}

enum TradeSide {
  TRADE_SIDE_UNSPECIFIED = 0;
  TRADE_SIDE_BUY = 1;
  TRADE_SIDE_SELL = 2;
}

message SpotFillActivity {
  TradeSide side = 1;
  ActivityTokenAmount filled = 2;
  int64 usd_value_cents = 3;
}

message OpenPerpActivity {
  PositionDirection direction = 1;
  Market market = 2;
  string size_decimal = 3;
  string fill_price_decimal = 4;
  int64 fee_cents = 5;
}

message ClosePerpActivity {
  PositionDirection direction = 1;
  Market market = 2;
  string size_decimal = 3;
  oneof result {
    int64 realized_pnl_cents = 4; // Signed; only when supplied upstream.
    ExecutionPriceAndFee execution = 5;
  }
}

message ExecutionPriceAndFee {
  string fill_price_decimal = 1;
  int64 fee_cents = 2;
}

message LiquidationActivity {
  Market market = 1;
  string size_decimal = 2;   // Contracts liquidated.
  int64 usd_value_cents = 3; // Notional of the liquidated size.
}

message GenesisAllocationActivity {
  ActivityTokenAmount received = 1;
}

message SwapActivity {
  ActivityTokenAmount sent = 1;
  ActivityTokenAmount received = 2;
}

// ==== Live prices ====

message LiveAssetUpdatesRequest {
  // Empty = every asset with a live market.
  repeated uint32 asset_ids = 1;
}

message AssetTicks {
  repeated AssetTick ticks = 1;
}

message AssetTick {
  uint32 asset_id = 1;
  string occurred_at = 2;   // RFC3339 UTC.
  // Price of the asset's reference market. Same format as HomeMarketPrice.price_decimal.
  string price_decimal = 3;
}

// ==== Catalog ====

message CatalogRequest {}

message CatalogResponse {
  // Every asset with a market the app can show. Sorted by the reference
  // market's 24h notional, largest first.
  repeated CatalogEntry entries = 1;
}

message CatalogEntry {
  Asset asset = 1;
  // Every market of this asset. The first is the reference market.
  repeated MarketQuote markets = 2;
}

// ==== Asset detail ====

message AssetDetailRequest {
  uint32 asset_id = 1;
  // The market whose candles, stats and activity to return. Unset = the
  // reference market. Check presence, not zero: market id 0 is a valid market.
  optional uint64 market_id = 2;
  // Candles of the selected market.
  ChartPeriod chart_period = 3;
}

message ChartPeriod {
  ChartInterval interval = 1;
  // RFC3339 UTC range [start_at, end_at). Both fall on a 15 minute boundary.
  // Candles are on the interval grid: the first is the one that contains start_at.
  string start_at = 2;
  string end_at = 3;
}

enum ChartInterval {
  CHART_INTERVAL_UNSPECIFIED = 0;
  CHART_INTERVAL_15M = 1;
  CHART_INTERVAL_30M = 2;
  CHART_INTERVAL_1H = 3;
  CHART_INTERVAL_2H = 4;
  CHART_INTERVAL_4H = 5;
  CHART_INTERVAL_8H = 6;
  CHART_INTERVAL_12H = 7;
  CHART_INTERVAL_1D = 8;
  CHART_INTERVAL_3D = 9;
  CHART_INTERVAL_1W = 10;
  CHART_INTERVAL_30D = 11;
}

message AssetDetailResponse {
  Asset asset = 1;
  // Tabs. The first is the reference market.
  repeated MarketQuote markets = 2;
  uint64 selected_market_id = 3;
  // One series, the selected market.
  Candles candles = 4;
  MarketStats stats = 5;
  // The user's activity on the selected market; newest first, at most 10.
  repeated ActivityItem recent_activity = 6;
  AssetDetailAbout about = 7;
}

message Candles {
  // Effective bucket duration in seconds.
  int64 candle_interval_seconds = 1;
  // One series per market, in request order.
  repeated CandleSeries series = 2;
}

message CandleSeries {
  uint64 market_id = 1;
  // Oldest first; empty when the market has no observations in the range.
  repeated Candle candles = 2;
}

message Candle {
  // Stable, series-unique id: "<market_id>:<bucket_start_rfc3339>".
  string id = 1;
  // RFC3339 UTC start of the candle bucket.
  string occurred_at = 2;
  // Simple price for price-only consumers. Always equals close_decimal.
  string price_decimal = 3;
  // USD OHLC decimal strings; low <= min(open, close), high >= max(open, close).
  string open_decimal = 4;
  string high_decimal = 5;
  string low_decimal = 6;
  string close_decimal = 7;
}

message MarketStats {
  oneof stats {
    PerpStats perp = 1;
    SpotStats spot = 2;
  }
}

message PerpStats {
  int64 volume_24h_cents = 1;
  // Current hourly funding as a decimal fraction, e.g. "0.0000125".
  string hourly_funding_rate_fraction = 2;
  // Empty when unknown.
  string all_time_high_price_decimal = 3;
  int32 max_leverage = 4;
  string category = 5;
  int64 open_interest_cents = 6;
}

message SpotStats {
  int64 volume_24h_cents = 1;
  int64 holder_count = 2;
  int64 fully_diluted_valuation_cents = 3;
  // Empty when unknown.
  string all_time_high_price_decimal = 4;
  int64 market_cap_cents = 5;
}

message AssetDetailAbout {
  string description = 1;
  repeated AssetDetailAboutLink links = 2;
}

message AssetDetailAboutLink {
  AssetDetailAboutLinkType type = 1;
  string url = 2;
}

enum AssetDetailAboutLinkType {
  ASSET_DETAIL_ABOUT_LINK_TYPE_UNSPECIFIED = 0;
  ASSET_DETAIL_ABOUT_LINK_TYPE_WEBSITE = 1;
  ASSET_DETAIL_ABOUT_LINK_TYPE_EXPLORER = 2;
  ASSET_DETAIL_ABOUT_LINK_TYPE_SOCIAL = 3;
}

// ==== Asset detail live updates ====

// Dedicated price stream for the open asset detail screen.
message AssetDetailLiveUpdatesRequest {
  uint64 market_id = 1;
}

message MarketTick {
  uint64 market_id = 1;
  string occurred_at = 2;   // RFC3339 UTC.
  string price_decimal = 3; // Same format as HomeMarketPrice.price_decimal.
}

// ==== Candles ====

message CandlesRequest {
  // Non-empty, at most 50. One series per market comes back, in this order.
  repeated uint64 market_ids = 1;
  ChartPeriod chart_period = 2;
}

// ==== UserStream ====

message UserStreamRequest {}

message UserSnapshot {
  // RFC3339 UTC time at which this internally consistent snapshot was calculated.
  string as_of = 1;
  // Aggregate across every authenticated wallet.
  PortfolioValue all_wallets_value = 2;
  // Wallet selector display order.
  repeated UserWallet wallets = 3;
}

message UserWallet {
  WalletReference wallet = 1;
  PortfolioValue value = 2;
  // Empty arrays mean this wallet has no current holdings or positions.
  // Display order: market value, largest first.
  repeated SpotHolding spot_holdings = 3;
  // Display order: notional value, largest first.
  repeated OpenPerpPosition perp_positions = 4;
}

message WalletReference {
  string wallet_id = 1;
  string name = 2;
}

message PortfolioValue {
  int64 total_balance_cents = 1;
  int64 change_cents = 2;       // Signed; current product-defined period.
  double change_percentage = 3; // Signed; same period as change_cents.
}

message SpotHolding {
  // "<wallet_id>:<token ref>".
  string position_id = 1;
  Token token = 2;
  string quantity_decimal = 3;
  // 0 when the token has no price.
  int64 market_value_cents = 4;
  // Absent when the token has no price or no cost basis.
  SpotPositionDetails position_details = 5;
}

message OpenPerpPosition {
  // "<wallet_id>:<market_id>".
  string position_id = 1;
  Market market = 2;
  int32 leverage = 3;
  PositionDirection direction = 4;
  int64 unrealized_pnl_cents = 5; // Signed.
  double roe_percent = 6;         // Signed.
  // Presence means iOS shows a liquidation warning.
  PerpLiquidationWarning liquidation_warning = 7;
  // Present for every current open perp position.
  PerpPositionDetails position_details = 8;
}

message SpotPositionDetails {
  int64 unrealized_pnl_cents = 1; // Signed.
  string average_cost_price_decimal = 2;
  double roe_percent = 3; // Signed.
  double portfolio_share_percent = 4;
}

message PerpPositionDetails {
  int64 funding_cents = 1; // Signed net funding value.
  string mark_price_decimal = 2;
  string entry_price_decimal = 3;
  string liquidation_price_decimal = 4;
  string size_decimal = 5; // Base-asset quantity.
  int64 notional_value_cents = 6; // Current USD notional.
  int64 margin_cents = 7; // Margin shown for this position.
  PerpMarginMode margin_mode = 8;
  // Absent when the position has no take-profit or stop-loss order.
  PerpAutoClose auto_close = 9;
}

enum PerpMarginMode {
  PERP_MARGIN_MODE_UNSPECIFIED = 0;
  PERP_MARGIN_MODE_ISOLATED = 1;
  PERP_MARGIN_MODE_CROSS = 2;
}

message PerpAutoClose {
  string take_profit_price_decimal = 1;
  string stop_loss_price_decimal = 2;
}

message PerpLiquidationWarning {
  double distance_percentage = 1;
}
