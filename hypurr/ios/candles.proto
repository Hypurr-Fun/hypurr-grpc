syntax = "proto3";
package hypurr.ios;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr/ios;ios";

import "hypurr/ios/candle.proto";
import "hypurr/ios/period.proto";

service CandlesService {
  rpc Candles(CandlesRequest) returns (.hypurr.ios.Candles);
  rpc CandlesStream(CandlesStreamRequest) returns (stream Candle);
}

message CandlesRequest {
  // Non-empty, at most 50. One series per market comes back, in this order.
  repeated uint64 market_ids = 1;
  ChartPeriod chart_period = 2;
}

message CandlesStreamRequest {
  uint64 market_id = 1;
  ChartInterval interval = 2;
}
