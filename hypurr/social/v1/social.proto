syntax = "proto3";
package hypurr.social.v1;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr/social/v1;socialv1";

// SocialService: Hfun users following each other.
//
// Privacy:
// - A profile is public or private (UpdateProfileSettings, public by
//   default). Following a public profile is accepted at once; following a
//   private one sends a request its owner accepts or declines. Making a
//   private profile public accepts every pending request.
// - Each wallet is public or private (Telegram.HyperliquidWalletSetPublic,
//   private by default). A private wallet never shows on the profile, not to
//   followers either. A public wallet shows to whoever can view the profile:
//   anyone for a public profile, accepted followers for a private one.
// - A private profile still shows its header (name, avatar, counts) so it
//   can be requested; its wallets and follow lists stay hidden (can_view
//   false). The owner always sees their whole profile, private wallets
//   included (flagged public = false).
//
// Every call needs the caller's JWT: reads user:read, changes settings:write.
service SocialService {
  // A profile by user id or username; neither means the caller's own.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfileSettings(UpdateProfileSettingsRequest) returns (UpdateProfileSettingsResponse);

  // Follow is accepted at once on a public profile, pending on a private one.
  // Following again is a no-op that returns the current status.
  rpc Follow(FollowRequest) returns (FollowResponse);
  // Unfollow also cancels a pending request.
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse);
  // RemoveFollower drops one of the caller's followers.
  rpc RemoveFollower(RemoveFollowerRequest) returns (RemoveFollowerResponse);

  // Accepted followers / followees of a user, newest first. Visible when the
  // profile is (can_view).
  rpc ListFollowers(ListFollowsRequest) returns (ListFollowsResponse);
  rpc ListFollowing(ListFollowsRequest) returns (ListFollowsResponse);
  // Pending requests to follow the caller, newest first.
  rpc ListFollowRequests(ListFollowRequestsRequest) returns (ListFollowsResponse);
  rpc RespondFollowRequest(RespondFollowRequestRequest) returns (RespondFollowRequestResponse);

  // Posts: text, optionally linked to one of the author's open perp
  // positions. A post is visible to whoever can view its author's profile.
  //
  // CreatePost checks the position live on Hyperliquid (it must be open in
  // one of the caller's wallets) and stores a snapshot of it; an unknown
  // market or no open position fails with FAILED_PRECONDITION.
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  // DeletePost deletes one of the caller's posts.
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  // A user's posts, newest first. Visible when the profile is (can_view).
  rpc ListUserPosts(ListUserPostsRequest) returns (ListPostsResponse);
  // The caller's posts and those of the users they follow (accepted),
  // newest first.
  rpc GetFeed(GetFeedRequest) returns (ListPostsResponse);
}

enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PUBLIC = 1;
  VISIBILITY_PRIVATE = 2;
}

enum FollowStatus {
  FOLLOW_STATUS_NONE = 0;
  FOLLOW_STATUS_PENDING = 1;  // requested, waiting for the private profile's owner
  FOLLOW_STATUS_ACCEPTED = 2;
}

message UserSummary {
  int64 user_id = 1;
  string username = 2;
  string display_name = 3;
  string avatar_ref = 4;
  Visibility visibility = 5;
  FollowStatus following = 6;  // the caller's follow of this user
  FollowStatus followed_by = 7; // this user's follow of the caller
}

message ProfileWallet {
  int64 wallet_id = 1;
  string name = 2;
  string address = 3;
  bool public = 4; // false only on the owner's own view
}

message Profile {
  UserSummary user = 1;
  bool is_self = 2;
  // The caller sees the wallets and follow lists.
  bool can_view = 3;
  int64 followers_count = 4;
  int64 following_count = 5;
  // Pending requests to follow this profile; the owner's own view only.
  int64 follow_requests_count = 6;
  repeated ProfileWallet wallets = 7; // empty unless can_view
}

message GetProfileRequest {
  oneof user {
    int64 user_id = 1;
    string username = 2; // case-insensitive, Telegram username first
  }
}

message GetProfileResponse {
  Profile profile = 1;
}

message UpdateProfileSettingsRequest {
  Visibility visibility = 1; // UNSPECIFIED leaves it as is
}

message UpdateProfileSettingsResponse {
  Profile profile = 1;
}

message FollowRequest {
  int64 user_id = 1;
}

message FollowResponse {
  FollowStatus status = 1;
}

message UnfollowRequest {
  int64 user_id = 1;
}

message UnfollowResponse {}

message RemoveFollowerRequest {
  int64 user_id = 1;
}

message RemoveFollowerResponse {}

message ListFollowsRequest {
  int64 user_id = 1; // 0 = the caller
  int32 limit = 2;   // default 50, at most 200
  int32 offset = 3;
}

message ListFollowsResponse {
  repeated UserSummary users = 1;
  int64 total = 2;
}

message ListFollowRequestsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message RespondFollowRequestRequest {
  int64 user_id = 1; // the requester
  bool accept = 2;   // false declines and deletes the request
}

message RespondFollowRequestResponse {}

enum PositionSide {
  POSITION_SIDE_UNSPECIFIED = 0;
  POSITION_SIDE_LONG = 1;
  POSITION_SIDE_SHORT = 2;
}

// PositionLink names the position to attach: one of the caller's wallets and
// the market (registry security id, as in ios.v2). Perps only for now.
message PositionLink {
  int64 wallet_id = 1;
  uint64 market_id = 2;
}

// PostPosition is the position as it was when posted, plus its live state.
message PostPosition {
  uint64 market_id = 1;
  string symbol = 2;           // "BTC", "xyz:TSLA"
  PositionSide side = 3;
  double size = 4;             // base units, positive
  double entry_price = 5;
  double mark_price = 6;       // when posted
  double notional_usd = 7;     // when posted
  int32 leverage = 8;
  string leverage_type = 9;    // "cross", "isolated"
  // The wallet, when it is public (or the caller owns it). A post from a
  // private wallet shows the position but not the wallet: wallet_id 0 and
  // empty name and address.
  int64 wallet_id = 10;
  string wallet_name = 11;
  string wallet_address = 12;
  // Live: whether the wallet still holds the position on the same side, and
  // the market's current mark price (about a minute fresh).
  bool open = 13;
  double current_mark_price = 14;
}

message Post {
  int64 id = 1;
  UserSummary author = 2;
  string body = 3;
  PostPosition position = 4;   // unset for a text post
  int64 created_at_ms = 5;
}

message CreatePostRequest {
  string body = 1;             // at most 1000 characters; may be empty with a position
  PositionLink position = 2;
}

message CreatePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  int64 post_id = 1;
}

message DeletePostResponse {}

message GetPostRequest {
  int64 post_id = 1;
}

message GetPostResponse {
  Post post = 1;
}

message ListUserPostsRequest {
  int64 user_id = 1;   // 0 = the caller
  int32 limit = 2;     // default 30, at most 100
  int64 before_id = 3; // page cursor: posts older than this id; 0 = newest
}

message GetFeedRequest {
  int32 limit = 1;     // default 30, at most 100
  int64 before_id = 2;
}

message ListPostsResponse {
  repeated Post posts = 1;
  int64 next_before_id = 2; // 0 when there is no more
}
