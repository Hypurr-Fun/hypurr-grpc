  int64 wallet_id = 2;
}

message PortfolioAllocatorDeleteResponse {
}

// ============== Portfolio Source CRUD ==============

// PortfolioAllocatorSourceCreateRequest - adds a new source to an allocator
message PortfolioAllocatorSourceCreateRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  string name = 3;                    // unique name within allocator
  string source_type = 4;             // "copy_trading" or "discretionary"
  double weight = 5;                  // leverage contribution
  google.protobuf.Struct config = 6;  // source-specific config
}

message PortfolioAllocatorSourceCreateResponse {
  PortfolioSource source = 1;
}

// PortfolioAllocatorSourceUpdateRequest - updates source settings (all fields optional except identifiers)
message PortfolioAllocatorSourceUpdateRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  string name = 3;                              // identifies the source to update
  google.protobuf.DoubleValue weight = 4;       // new weight
  google.protobuf.Struct config = 5;            // new config (replaces existing)
  google.protobuf.BoolValue enabled = 6;        // enable/disable source
}

message PortfolioAllocatorSourceUpdateResponse {
  PortfolioSource source = 1;
}

// PortfolioAllocatorSourceDelete - removes a source from an allocator
message PortfolioAllocatorSourceDeleteRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  string name = 3;                    // identifies the source to delete
}

message PortfolioAllocatorSourceDeleteResponse {
}

message AuthorizationCodeTelegramAuthData {
  map<string, string> auth_data = 1;
}

message AuthorizationCodeProviderJwt {
  // Selects the trusted verifier configuration, e.g. "google", "apple", or a
  // configured issuer for a first-party integration.
  string provider = 1;

  // Third-party identity assertion. This is verified by the authorization
  // server and is never returned to clients as the OAuth authorization code.
  string jwt = 2;
}

message AuthorizationCodeCreateRequest {
  // OAuth authorization request fields. The issued code must be short-lived,
  // single-use, and bound to client_id, redirect_uri, scope, and PKCE fields.
  string client_id = 1;
  string redirect_uri = 2;
  string scope = 3;
  string state = 4;
  string code_challenge = 5;
  string code_challenge_method = 6; // Usually "S256".

  oneof identity_assertion {
    AuthorizationCodeTelegramAuthData telegram = 7;
    AuthorizationCodeProviderJwt provider_jwt = 8;
  }
}

message AuthorizationCodeCreateResponse {
  // Hypurr-issued opaque authorization code for the token endpoint.
  string code = 1;

  // Code lifetime in seconds.
  int64 expires_in = 2;

  // redirect_uri with code and state appended, for the /authorize handler.
  string redirect_url = 3;
}


service Telegram {
  rpc TelegramUser (TelegramUserRequest) returns (TelegramUserResponse) {}
  rpc TelegramAuthExchange (TelegramAuthExchangeRequest) returns (TelegramAuthExchangeResponse) {}
  // Issues a Hypurr OAuth authorization code after verifying provider identity evidence.
  rpc CreateAuthorizationCode (AuthorizationCodeCreateRequest) returns (AuthorizationCodeCreateResponse) {}
  rpc TelegramUserWallets (TelegramUserWalletsRequest) returns (TelegramUserWalletsResponse) {}
  rpc HyperliquidMostTrackedWallets (HyperliquidMostTrackedWalletsRequest) returns (HyperliquidMostTrackedWalletsResponse) {}

  // Launch
  rpc HyperliquidLaunchTrade (HyperliquidLaunchTradeRequest) returns (HyperliquidLaunchTradeResponse) {}
  rpc LaunchHyperliquidLaunch (LaunchHyperliquidLaunchRequest) returns (LaunchHyperliquidLaunchResponse) {}
  rpc EditHyperliquidLaunch (EditHyperliquidLaunchRequest) returns (EditHyperliquidLaunchResponse) {}

  // HpumpV1
  rpc HpumpV1LaunchTrade (HpumpV1LaunchTradeRequest) returns (HpumpV1LaunchTradeResponse) {}
  rpc LaunchHpumpV1Launch (LaunchHpumpV1LaunchRequest) returns (LaunchHpumpV1LaunchResponse) {}

  // Core
  rpc HyperliquidCoreAction (HyperliquidCoreActionRequest) returns (HyperliquidCoreActionResponse) {}
  rpc EVMSignTransaction (EVMSignTransactionRequest) returns (EVMSignTransactionResponse) {}

  // Spot
  rpc HyperliquidSpotTrade (HyperliquidSpotTradeRequest) returns (HyperliquidSpotTradeResponse) {}
  rpc HyperliquidCoreTrade (HyperliquidCoreTradeRequest) returns (HyperliquidCoreTradeResponse) {}
  rpc HyperliquidCoreCancelOrders (HyperliquidCoreCancelOrdersRequest) returns (HyperliquidCoreCancelOrdersResponse) {}

  // Sessions
  rpc HyperliquidWalletSpotTwapSessions (HyperliquidWalletSpotTwapSessionsRequest) returns (HyperliquidWalletSpotTwapSessionsResponse) {}
  rpc HyperliquidWalletTwapSessions (HyperliquidWalletTwapSessionsRequest) returns (HyperliquidWalletTwapSessionsResponse) {}
  rpc HyperliquidWalletScaleSessions (HyperliquidWalletScaleSessionsRequest) returns (HyperliquidWalletScaleSessionsResponse) {}

  rpc HyperliquidTwapCreate (HyperliquidTwapCreateRequest) returns (HyperliquidTwapCreateResponse) {}
  rpc HyperliquidTwapModify (HyperliquidTwapModifyRequest) returns (HyperliquidTwapModifyResponse) {}
  rpc HyperliquidTwapCancel (HyperliquidTwapCancelRequest) returns (HyperliquidTwapCancelResponse) {}
  rpc HyperliquidScaleCreate (HyperliquidScaleCreateRequest) returns (HyperliquidScaleCreateResponse) {}
  rpc HyperliquidScaleCancel (HyperliquidScaleCancelRequest) returns (HyperliquidScaleCancelResponse) {}

  rpc HyperliquidSpotSniperConfigs (HyperliquidSpotSniperConfigsRequest) returns (HyperliquidSpotSniperConfigsResponse) {}
  rpc CreateHyperliquidSpotSniperConfig (CreateHyperliquidSpotSniperConfigRequest) returns (CreateHyperliquidSpotSniperConfigResponse) {}
  rpc DeleteHyperliquidSpotSniperConfig (DeleteHyperliquidSpotSniperConfigRequest) returns (DeleteHyperliquidSpotSniperConfigResponse) {}
  rpc UpdateHyperliquidSpotSniperConfig (UpdateHyperliquidSpotSniperConfigRequest) returns (UpdateHyperliquidSpotSniperConfigResponse) {}

  rpc HyperliquidWalletCreate (HyperliquidWalletCreateRequest) returns (HyperliquidWalletCreateResponse) {}
  rpc HyperliquidWalletImport (HyperliquidWalletImportRequest) returns (HyperliquidWalletImportResponse) {}
  rpc HyperliquidWalletDelete (HyperliquidWalletDeleteRequest) returns (HyperliquidWalletDeleteResponse) {}
  rpc HyperliquidWalletSetPublic (HyperliquidWalletSetPublicRequest) returns (HyperliquidWalletSetPublicResponse) {}
  rpc HyperliquidAgentSignatureCreate (HyperliquidAgentSignatureCreateRequest) returns (HyperliquidAgentSignatureCreateResponse) {}
  rpc HyperliquidAgentWalletCreate (HyperliquidAgentWalletCreateRequest) returns (HyperliquidAgentWalletCreateResponse) {}
  rpc HyperliquidAgentWalletRenew (HyperliquidAgentWalletRenewRequest) returns (HyperliquidAgentWalletRenewResponse) {}
  rpc HyperliquidWalletUpdate (HyperliquidWalletUpdateRequest) returns (HyperliquidWalletUpdateResponse) {}

  // Cabal
  rpc HfunCabalAlerts (HfunCabalAlertsRequest) returns (stream HfunCabalAlertsResponse) {}
  rpc TelegramChatWalletPackCreate (TelegramChatWalletPackCreateRequest) returns (TelegramChatWalletPackCreateResponse) {}
  rpc TelegramChatWalletPackRename (TelegramChatWalletPackRenameRequest) returns (TelegramChatWalletPackRenameResponse) {}
  rpc TelegramChatWalletPackLabelAdd (TelegramChatWalletPackLabelAddRequest) returns (TelegramChatWalletPackLabelAddResponse) {}
  rpc TelegramChatWalletPackLabelModify (TelegramChatWalletPackLabelModifyRequest) returns (TelegramChatWalletPackLabelModifyResponse) {}
  rpc TelegramChatWalletPackLabelRemove (TelegramChatWalletPackLabelDeleteRequest) returns (TelegramChatWalletPackLabelDeleteResponse) {}

  // Support
  rpc SupportConversationStart(SupportConversationStartRequest) returns (SupportConversationStartResponse);
  rpc SupportMessageSend(SupportMessageSendRequest) returns (SupportMessageSendResponse);
  rpc SupportConversationHistory(SupportConversationHistoryRequest) returns (SupportConversationHistoryResponse);
  rpc SupportConversationList(SupportConversationListRequest) returns (SupportConversationListResponse);
  rpc SupportConversationClose(SupportConversationCloseRequest) returns (SupportConversationCloseResponse);
  rpc SupportTicketStatus(SupportTicketStatusRequest) returns (SupportTicketStatusResponse);

  // Portfolio
  rpc PortfolioAllocatorGet(PortfolioAllocatorGetRequest) returns (PortfolioAllocatorGetResponse) {}
  rpc PortfolioAllocatorList(PortfolioAllocatorListRequest) returns (PortfolioAllocatorListResponse) {}
  rpc PortfolioAllocatorSourceGet(PortfolioAllocatorSourceGetRequest) returns (PortfolioAllocatorSourceGetResponse) {}
  rpc PortfolioAllocatorSourceList(PortfolioAllocatorSourceListRequest) returns (PortfolioAllocatorSourceListResponse) {}
  rpc PortfolioAllocatorCreate(PortfolioAllocatorCreateRequest) returns (PortfolioAllocatorCreateResponse) {}
  rpc PortfolioAllocatorUpdate(PortfolioAllocatorUpdateRequest) returns (PortfolioAllocatorUpdateResponse) {}
  rpc PortfolioAllocatorDelete(PortfolioAllocatorDeleteRequest) returns (PortfolioAllocatorDeleteResponse) {}
  rpc PortfolioAllocatorSourceCreate(PortfolioAllocatorSourceCreateRequest) returns (PortfolioAllocatorSourceCreateResponse) {}
  rpc PortfolioAllocatorSourceUpdate(PortfolioAllocatorSourceUpdateRequest) returns (PortfolioAllocatorSourceUpdateResponse) {}
  rpc PortfolioAllocatorSourceDelete(PortfolioAllocatorSourceDeleteRequest) returns (PortfolioAllocatorSourceDeleteResponse) {}
}
