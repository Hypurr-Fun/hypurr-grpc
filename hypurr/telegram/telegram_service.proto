// SupportConversationStart - Start or resume a conversation

message SupportConversationStartRequest {
  map<string, string> auth_data = 1;
  string project_id = 2; // optional, defaults to "hfun"
}

message SupportConversationStartResponse {
  int64 conversation_id = 1;
  string project_id = 2;
  bool closed = 3;
  repeated SupportMessage messages = 4;
  SupportTicket ticket = 5; // optional, populated if ticket was opened
}

// SupportMessageSend - Send a message in a conversation

message SupportMessageSendRequest {
  map<string, string> auth_data = 1;
  int64 conversation_id = 2;
  string message = 3;
}

message SupportMessageSendResponse {
  SupportMessage user_message = 1;
  SupportMessage ai_response = 2; // optional, populated if AI responds
  SupportTicket ticket = 3; // optional, populated if ticket was opened
}

// SupportConversationHistory - Get message history

message SupportConversationHistoryRequest {
  map<string, string> auth_data = 1;
  int64 conversation_id = 2;
  int32 limit = 3;  // default 50, max 100
  int32 offset = 4; // default 0
}

message SupportConversationHistoryResponse {
  repeated SupportMessage messages = 1;
  SupportTicket ticket = 2;
}

// SupportConversationList - List user's conversations

message SupportConversationListRequest {
  map<string, string> auth_data = 1;
  string project_id = 2; // optional, filter by project
  int32 limit = 3;  // default 20, max 100
  int32 offset = 4; // default 0
}

message SupportConversationListResponse {
  repeated SupportConversation conversations = 1;
}

// SupportConversationClose - Close a conversation

message SupportConversationCloseRequest {
  map<string, string> auth_data = 1;
  int64 conversation_id = 2;
}

message SupportConversationCloseResponse {}

// SupportTicketStatus - Get ticket status for a conversation

message SupportTicketStatusRequest {
  map<string, string> auth_data = 1;
  int64 conversation_id = 2;
}

message SupportTicketStatusResponse {
  SupportTicket ticket = 1;
}

