// ============== Portfolio backtest ==============

// PortfolioBacktest replays the recorded weights of the user's sources on
// hourly closes. By default, before a source went live its pushed backtest
// series is used and live_since marks the switch so the two are never
// mistaken for one another; mode can pick live or backtest weights only.
// Each leg reports how its live weights track its backtest series.
message PortfolioBacktestRequest {
  map<string, string> auth_data = 1;
  repeated PortfolioBacktestLeg legs = 2;       // sources to combine; empty = the wallet's allocator
  int64 wallet_id = 3;                          // with no legs: its allocator's enabled attachments
  int64 from_ts = 4;                            // unix seconds; 0 = earliest common history
  int64 to_ts = 5;                              // unix seconds; 0 = now
  google.protobuf.DoubleValue cost_bps = 6;     // per unit of turnover; unset = 4.5
  PortfolioBacktestMode mode = 7;               // default blended: backtest series until live
  int64 benchmark_pair_id = 8;                  // 0 = BTC
  PortfolioBacktestResolution resolution = 9;
  // Unset: the book is on target at every hour (price drift rebalanced for
  // free). Set (0 allowed): held weights drift with prices and a pair trades
  // back to target only when its deviation reaches this, as the allocator does.
  google.protobuf.DoubleValue min_rebalance_pct = 10;
  string rebalance_mode = 11;                   // "" = absolute; see PortfolioAllocator
  // Optional thresholds to replay the portfolio with (e.g. 0, 0.005, 0.01,
  // 0.02, 0.05): one sweep point each, plus a recommendation.
  repeated double rebalance_sweep = 12;
  // Pairs left out of every leg's targets, as if the sources never traded
  // them; the rest of each target is kept as is (not rescaled).
  repeated int64 exclude_pair_ids = 13;
}

message PortfolioBacktestResponse {
  PortfolioBacktestSeries portfolio = 1;
  PortfolioBacktestStats stats = 2;
  repeated PortfolioBacktestLegResult legs = 3;
  PortfolioBacktestSeries benchmark = 4;        // buy and hold, weight 1
  int64 live_since = 5;                         // unix seconds: from here every leg is live; 0 = never
  repeated string warnings = 6;
  int64 benchmark_pair_id = 7;
  repeated PortfolioRebalanceSweepPoint rebalance_sweep = 8;
  // The largest swept threshold within 0.05 Sharpe of the best, among those
  // whose tracking error stays under 10 % of the target book's volatility;
  // 0 when no sweep ran.
  double recommended_min_rebalance_pct = 9;
  // Every pair the legs' weights hold over the range, excluded ones included
  // (flagged), measured on the combined book before exclusion.
  repeated PortfolioBacktestPair pairs = 10;
}

// PortfolioSourceBacktestPush stores a research series for one of the user's
// sources, tagged backtest. Each snapshot is complete (a pair left out is
// flat). With replace, backtest rows of the source between the first and last
// snapshot are deleted first; with clear, all of them are. Push long series
// in chunks of consecutive ranges.
message PortfolioSourceBacktestPushRequest {
  map<string, string> auth_data = 1;
  int64 source_id = 2;
  string name = 3;                              // used when source_id is 0
  string tag = 4;                               // provenance, e.g. "pure_momentum.ipynb@be69ada"
  repeated PortfolioWeightSnapshot snapshots = 5;
  bool replace = 6;
  bool clear = 7;
}

message PortfolioSourceBacktestPushResponse {
  int64 source_id = 1;
  int64 snapshots = 2;
  int64 rows = 3;
  int64 from_ts = 4;                            // unix milliseconds
  int64 to_ts = 5;
}

// PortfolioOptimize suggests weights for a set of the user's sources from
// their replayed daily returns (net of costs, the blended history the backtest
// shows): sized by risk, scaled to target_vol, then bounded. It changes
// nothing; the weights are applied like any other scenario.
message PortfolioOptimizeRequest {
  map<string, string> auth_data = 1;
  repeated PortfolioBacktestLeg legs = 2;       // sources; their weights are ignored
  int64 from_ts = 3;                            // unix seconds; 0 = earliest common history
  google.protobuf.DoubleValue cost_bps = 4;     // unset = 4.5
  PortfolioOptimizeMethod method = 5;
  double target_vol = 6;                        // annualised portfolio vol; 0 = 0.20
  double max_leverage = 7;                      // cap on the sum of weights; 0 = none
  double min_weight = 8;                        // per source; 0 = none
  double max_weight = 9;                        // per source; 0 = none
  int64 halflife_days = 10;                     // of the vol/correlation estimates; 0 = 60
  // Posterior Sharpe prior, 0 = default:
  double research_haircut = 11;                 // research Sharpe multiplier; 0 = 0.5
  double research_weight = 12;                  // live years one research year is worth; 0 = 0.25
  double prior_sharpe_sd = 13;                  // sd of the zero-mean prior on annual Sharpe; 0 = 1.0
  double correlation_shrink = 14;               // towards zero, in [0, 1]; 0 = 0.5
  // Rescale the suggested weights to sum to this leverage; 0 = as optimised.
  // The threshold sweep runs on the final weights, so set it here rather
  // than rescaling afterwards (an absolute threshold depends on the scale).
  double target_leverage = 15;
  // Optional: replay the suggested portfolio at each of these rebalance
  // thresholds (see PortfolioBacktestRequest.rebalance_sweep).
  repeated double rebalance_sweep = 16;
  string rebalance_mode = 17;                   // "" = absolute
  // Pairs left out of every source's targets (see PortfolioBacktestRequest).
  repeated int64 exclude_pair_ids = 18;
}

message PortfolioOptimizeResponse {
  repeated PortfolioOptimizeWeight weights = 1;
  double expected_vol = 2;                      // annualised, at the suggested weights
  int64 from_ts = 3;                            // history the estimates used, unix seconds
  int64 to_ts = 4;
  int64 days = 5;
  repeated string warnings = 6;
  // With rebalance_sweep: the suggested portfolio at each threshold, and the
  // recommended one (as in PortfolioBacktestResponse); 0 when no sweep ran.
  repeated PortfolioRebalanceSweepPoint rebalance_sweep = 7;
  double recommended_min_rebalance_pct = 8;
}

message AuthorizationCodeTelegramAuthData {
  map<string, string> auth_data = 1;
}

message AuthorizationCodeProviderJwt {
  // Selects the trusted verifier configuration, e.g. "google", "apple", or a
  // configured issuer for a first-party integration.
  string provider = 1;

  // Third-party identity assertion. This is verified by the authorization
  // server and is never returned to clients as the OAuth authorization code.
  string jwt = 2;
}

message AuthorizationCodeCreateRequest {
  // OAuth authorization request fields. The issued code must be short-lived,
  // single-use, and bound to client_id, redirect_uri, scope, and PKCE fields.
  string client_id = 1;
  string redirect_uri = 2;
  string scope = 3;
  string state = 4;
  string code_challenge = 5;
  string code_challenge_method = 6; // Usually "S256".

  oneof identity_assertion {
    AuthorizationCodeTelegramAuthData telegram = 7;
    AuthorizationCodeProviderJwt provider_jwt = 8;
  }
}

message AuthorizationCodeCreateResponse {
  // Hypurr-issued opaque authorization code for the token endpoint.
  string code = 1;

  // Code lifetime in seconds.
  int64 expires_in = 2;

  // redirect_uri with code and state appended, for the /authorize handler.
  string redirect_url = 3;
}


message TelegramOnrampPurchasesRequest {
  map<string, string> auth_data = 1;
  string app = 2;
}

