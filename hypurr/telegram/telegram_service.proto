// ============== Portfolio Source CRUD ==============

// PortfolioAllocatorSourceCreateRequest - adds a new source to an allocator
message PortfolioAllocatorSourceCreateRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  string name = 3;                    // unique name within allocator
  string source_type = 4;             // "copy_trading" or "discretionary"
  double weight = 5;                  // leverage contribution
  google.protobuf.Struct config = 6;  // source-specific config
}

message PortfolioAllocatorSourceCreateResponse {
  PortfolioSource source = 1;
}

// PortfolioAllocatorSourceUpdateRequest - updates source settings (all fields optional except identifiers)
message PortfolioAllocatorSourceUpdateRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  string name = 3;                              // identifies the source to update
  google.protobuf.DoubleValue weight = 4;       // new weight
  // Deprecated: use PortfolioSourceUpdate. Replaces the config of the shared
  // source, so every allocator attached to it moves, not just this wallet's.
  google.protobuf.Struct config = 5;
  google.protobuf.BoolValue enabled = 6;        // enable/disable source
  bool allow_while_enabled = 7;                 // permit a weight/config update while the allocator is enabled (picked up on the next rebalance cycle)
}

message PortfolioAllocatorSourceUpdateResponse {
  PortfolioSource source = 1;
}

// PortfolioAllocatorSourceDelete - removes a source from an allocator, and
// deletes the shared source too when no other allocator uses it. Use
// PortfolioAllocatorSourceDetach to keep the shared source.
message PortfolioAllocatorSourceDeleteRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  string name = 3;                    // identifies the source to delete
}

message PortfolioAllocatorSourceDeleteResponse {
}

// PortfolioAllocatorSourceAttach - attaches an existing shared source to an
// allocator. The allocator must be disabled.
message PortfolioAllocatorSourceAttachRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  int64 source_id = 3;                // shared source, by id...
  string source_name = 4;             // ...or by name
  string name = 5;                    // name within the allocator (default: the shared source's name)
  double weight = 6;                  // leverage contribution
}

message PortfolioAllocatorSourceAttachResponse {
  PortfolioSource source = 1;
}

// PortfolioAllocatorSourceDetach - removes a source from an allocator and
// keeps the shared source. The allocator must be disabled.
message PortfolioAllocatorSourceDetachRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  string name = 3;                    // name within the allocator
}

message PortfolioAllocatorSourceDetachResponse {
}

