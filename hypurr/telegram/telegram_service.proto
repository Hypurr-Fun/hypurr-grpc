syntax = "proto3";
package hypurr;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr/telegram";

import "google/protobuf/wrappers.proto";

import "hypurr/tools.proto";
import "hypurr/wallet.proto";
import "hypurr/user.proto";
import "hypurr/launch.proto";
import "hypurr/common.proto";
import "hypurr/hpumpv1.proto";
import "hypurr/trade.proto";
import "hypurr/cabal.proto";
import "hypurr/support.proto";
import "hypurr/portfolio.proto";
import "google/protobuf/struct.proto";


// Auth endpoints
message TelegramUserRequest {
  map<string, string> auth_data = 1;
}

message TelegramUserResponse {
  TelegramUser user = 1;
  string auth_token = 2;
}

message TelegramAuthExchangeRequest {
  map<string, string> auth_data = 1;
  string return_to = 2;
  string state = 3;
  string scope = 4;
}

message TelegramAuthExchangeResponse {
  TelegramUser user = 1;
  string auth_token = 2;
  string redirect_url = 3;
}

message TelegramUserWalletsRequest {
  map<string, string> auth_data = 1;
}

message TelegramUserWalletsResponse {
  repeated HyperliquidWallet wallets = 1;
}

message HyperliquidMostTrackedWallet {
  HyperliquidPublicWallet wallet = 1;
  int64 tracked_count = 2;
}

message HyperliquidMostTrackedWalletsRequest {
  int32 limit = 1;
}

message HyperliquidMostTrackedWalletsResponse {
  repeated HyperliquidMostTrackedWallet wallets = 1;
}

message HyperliquidCoreActionRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  bytes action = 3;  // JSON-encoded action-specific params
  int64 nonce = 4;
  google.protobuf.StringValue vault_address = 5;
}

message HyperliquidCoreActionResponse {
  string status = 1;
  string error = 2;
  bytes result = 3;  // JSON-encoded result
}

message HyperliquidCoreTradeRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  HyperliquidCoreOrder order = 3;
}

message HyperliquidCoreTradeResponse {
  double base_amount = 1;
  double quote_amount = 2;
  string message = 3;
  bool success = 4;
}

message HyperliquidCoreCancelOrdersRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  repeated HyperliquidCoreCancel cancels = 3;
}

message HyperliquidCoreCancelOrdersResponse {
  repeated HyperliquidCoreOrderCanceledStatus statuses = 1;
}

message HyperliquidTwapCreateRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  int64 duration = 3;
  bool buy = 4;
  bool use_chasing = 5;
  bool reduce_only = 6;
  google.protobuf.Int64Value spot_pair_id = 7;
  google.protobuf.Int64Value perp_pair_id = 8;
  google.protobuf.DoubleValue target_notional = 9;
  google.protobuf.DoubleValue target_quantity = 10;
  google.protobuf.DoubleValue target_leverage = 11;
  google.protobuf.DoubleValue min_price = 12;
  google.protobuf.DoubleValue max_price = 13;
}

message HyperliquidTwapCreateResponse {
  HyperliquidWalletTwapSession session = 1;
}

message HyperliquidTwapModifyRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  int64 session_id = 3;
  google.protobuf.DoubleValue target_notional = 4;
  google.protobuf.DoubleValue target_quantity = 5;
  google.protobuf.DoubleValue target_leverage = 6;
  google.protobuf.DoubleValue min_price = 7;
  google.protobuf.DoubleValue max_price = 8;
}

message HyperliquidTwapModifyResponse {
  HyperliquidWalletTwapSession session = 1;
}

message HyperliquidTwapCancelRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  int64 twap_session_id = 3;
}

message HyperliquidTwapCancelResponse {
}

message HyperliquidScaleCreateRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  int64 order_count = 3;
  bool buy = 4;
  google.protobuf.Int64Value spot_pair_id = 5;
  google.protobuf.Int64Value perp_pair_id = 6;
  google.protobuf.DoubleValue target_notional = 7;
  google.protobuf.DoubleValue target_quantity = 8;
  google.protobuf.DoubleValue target_leverage = 9;
  google.protobuf.DoubleValue min_price = 10;
  google.protobuf.DoubleValue max_price = 11;
}

message HyperliquidScaleCreateResponse {
  HyperliquidWalletScaleSession session = 1;
}

message HyperliquidScaleCancelRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  int64 scale_session_id = 3;
}

message HyperliquidScaleCancelResponse {
}

message HyperliquidLaunchTradeRequest {
  map<string, string> auth_data = 1;
  int64 launch_id = 2;
  int64 wallet_id = 3;
  TradeDirection direction = 4;
  double amount = 5;
}

message HyperliquidLaunchTradeResponse {
  double base_amount = 1;
  double quote_amount = 2;
  string message = 3;
  bool success = 4;
}

message HyperliquidSpotTradeRequest {
  map<string, string> auth_data = 1;
  int64 pair_id = 2;
  int64 wallet_id = 3;
  TradeDirection direction = 4;
  double amount = 5;
}

message HpumpV1LaunchTradeRequest {
  map<string, string> auth_data = 1;
  int64 launch_id = 2;
  int64 wallet_id = 3;
  TradeDirection direction = 4;
  string amount = 5;
  double max_slippage = 6;
  double max_gas_cost_usd = 7;
}

message HpumpV1LaunchTradeResponse {
  string base_amount = 1;
  string quote_amount = 2;
  string message = 3;
  bool success = 4;
}

message HyperliquidSpotTradeResponse {
  double base_amount = 1;
  double quote_amount = 2;
  string message = 3;
  bool success = 4;
}

message HyperliquidSpotSniperConfigsRequest {
  map<string, string> auth_data = 1;
}

message HyperliquidSpotSniperConfigsResponse {
  repeated HyperliquidSpotSniperConfig configs = 1;
}

message DeleteHyperliquidSpotSniperConfigRequest {
  map<string, string> auth_data = 1;
  int64 config_id = 2;
}

message DeleteHyperliquidSpotSniperConfigResponse {
  bool success = 1;
}

message CreateHyperliquidSpotSniperConfigRequest {
  map<string, string> auth_data = 1;
  HyperliquidSpotSniperConfig config = 2;
}

message CreateHyperliquidSpotSniperConfigResponse {
  bool success = 1;
  HyperliquidSpotSniperConfig config = 2;
}

message UpdateHyperliquidSpotSniperConfigRequest {
  map<string, string> auth_data = 1;
  HyperliquidSpotSniperConfig config = 2;
}

message UpdateHyperliquidSpotSniperConfigResponse {
  bool success = 1;
}

// TODO Deprecated
message HyperliquidWalletSpotTwapSessionsRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  bool enabled = 3;
}

message HyperliquidWalletSpotTwapSessionsResponse {
  repeated HyperliquidWalletSpotTwapSession sessions = 1;
}

message HyperliquidWalletTwapSessionsRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  google.protobuf.BoolValue enabled = 3;
}

message HyperliquidWalletTwapSessionsResponse {
  repeated HyperliquidWalletTwapSession sessions = 1;
}

message HyperliquidWalletScaleSessionsRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  google.protobuf.BoolValue enabled = 3;

}

message HyperliquidWalletScaleSessionsResponse {
  repeated HyperliquidWalletScaleSession sessions = 1;
}

message LaunchHyperliquidLaunchRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  string description = 3;
  string full_name = 4;
  string token_name = 5;
  bytes media = 6;
  MediaType media_type = 7;
  int64 dev_lockup_seconds = 8;
  double initial_purchase_notional = 9;
}

message LaunchHyperliquidLaunchResponse {
 HyperliquidLaunch launch = 1;
}

message LaunchHpumpV1LaunchRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  string description = 3;
  string full_name = 4;
  string token_name = 5;
  bytes media = 6;
  MediaType media_type = 7;
  int64 dev_lockup_seconds = 8;
  double initial_purchase_notional = 9;
  string launch_factory = 10;
}

message LaunchHpumpV1LaunchResponse {
  HpumpV1Launch launch = 1;
}

message EditHyperliquidLaunchRequest {
  map<string, string> auth_data = 1;
  int64 launch_id = 2;
  string description = 3;
  string full_name = 4;
  google.protobuf.BytesValue media = 5;
  MediaType media_type = 6;
  int64 dev_lockup_seconds = 7;
}

message EditHyperliquidLaunchResponse {
  HyperliquidLaunch launch = 1;
}

message HfunCabalAlertsRequest {
  map<string, string> auth_data = 1;
}

message HfunCabalAlertsResponse {
  repeated HypurrFunCabalAlert alerts = 1;
}

message TelegramChatWalletPackCreateRequest {
  map<string, string> auth_data = 1;
  string name = 2;
}

message TelegramChatWalletPackCreateResponse {
  int64 pack_id = 1;
}

message TelegramChatWalletPackLabelAddRequest {
  map<string, string> auth_data = 1;
  string wallet_address = 2;
  string wallet_label = 3;
  int64 pack_id = 4;
}

message TelegramChatWalletPackLabelAddResponse {

}

message TelegramChatWalletPackLabelModifyRequest {
  map<string, string> auth_data = 1;
  string wallet_label_old = 2;
  string wallet_label_new = 3;
  int64 pack_id = 4;
}

message TelegramChatWalletPackLabelModifyResponse {

}

message TelegramChatWalletPackLabelDeleteRequest {
  map<string, string> auth_data = 1;
  string wallet_label = 2;
  int64 pack_id = 3;
}

message TelegramChatWalletPackLabelDeleteResponse {

}

message TelegramChatWalletPackRenameRequest {
  map<string, string> auth_data = 1;
  int64 pack_id = 2;
  string name = 3;
}

message TelegramChatWalletPackRenameResponse {

}

message EIP712Signature {
  string agentAddress = 1;
  string agentName = 2;
  int64 nonce = 3;
  string signature = 4;
  int64 chain_id = 5;
}

message HyperliquidWalletDeleteRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
}

message HyperliquidWalletDeleteResponse {

}

message HyperliquidWalletCreateRequest {
  map<string, string> auth_data = 1;
  string name = 2;
}

message HyperliquidWalletCreateResponse {
  HyperliquidWallet wallet = 1;
}

message HyperliquidWalletSetPublicRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  bool public = 3;
}

message HyperliquidWalletSetPublicResponse {
  HyperliquidWallet wallet = 1;
}

message HyperliquidAgentSignatureCreateRequest {
  map<string, string> auth_data = 1;
  string address = 2;
}

message HyperliquidAgentSignatureCreateResponse {
  string agent = 1;
}

message HyperliquidAgentWalletCreateRequest {
  map<string, string> auth_data = 1;
  string name = 2;
  EIP712Signature signature = 3;
}

message HyperliquidAgentWalletCreateResponse {

}

// SupportConversationStart - Start or resume a conversation

message SupportConversationStartRequest {
  map<string, string> auth_data = 1;
  string project_id = 2; // optional, defaults to "hfun"
}

message SupportConversationStartResponse {
  int64 conversation_id = 1;
  string project_id = 2;
  bool closed = 3;
  repeated SupportMessage messages = 4;
  SupportTicket ticket = 5; // optional, populated if ticket was opened
}

// SupportMessageSend - Send a message in a conversation

message SupportMessageSendRequest {
  map<string, string> auth_data = 1;
  int64 conversation_id = 2;
  string message = 3;
}

message SupportMessageSendResponse {
  SupportMessage user_message = 1;
  SupportMessage ai_response = 2; // optional, populated if AI responds
  SupportTicket ticket = 3; // optional, populated if ticket was opened
}

// SupportConversationHistory - Get message history

message SupportConversationHistoryRequest {
  map<string, string> auth_data = 1;
  int64 conversation_id = 2;
  int32 limit = 3;  // default 50, max 100
  int32 offset = 4; // default 0
}

message SupportConversationHistoryResponse {
  repeated SupportMessage messages = 1;
  SupportTicket ticket = 2;
}

// SupportConversationList - List user's conversations

message SupportConversationListRequest {
  map<string, string> auth_data = 1;
  string project_id = 2; // optional, filter by project
  int32 limit = 3;  // default 20, max 100
  int32 offset = 4; // default 0
}

message SupportConversationListResponse {
  repeated SupportConversation conversations = 1;
}

// SupportConversationClose - Close a conversation

message SupportConversationCloseRequest {
  map<string, string> auth_data = 1;
  int64 conversation_id = 2;
}

message SupportConversationCloseResponse {}

// SupportTicketStatus - Get ticket status for a conversation

message SupportTicketStatusRequest {
  map<string, string> auth_data = 1;
  int64 conversation_id = 2;
}

message SupportTicketStatusResponse {
  SupportTicket ticket = 1;
}

message GetPortfolioAllocatorRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
}

message GetPortfolioAllocatorResponse {
  PortfolioAllocator allocator = 1;
}

message ListPortfolioAllocatorsRequest {
  map<string, string> auth_data = 1;
}

message ListPortfolioAllocatorsResponse {
  repeated PortfolioAllocator allocators = 1;
}

message ListEnabledPortfolioAllocatorsRequest {
  map<string, string> auth_data = 1;
}

message ListEnabledPortfolioAllocatorsResponse {
  repeated PortfolioAllocator allocators = 1;
}

message GetPortfolioSourceRequest {
  map<string, string> auth_data = 1;
  int64 allocator_id = 2;
  string name = 3;
}

message GetPortfolioSourceResponse {
  PortfolioSource source = 1;
}

message ListPortfolioSourcesRequest {
  map<string, string> auth_data = 1;
  int64 allocator_id = 2;
}

message ListPortfolioSourcesResponse {
  repeated PortfolioSource sources = 1;
}

// CreatePortfolioAllocator - creates a new allocator for a wallet
message CreatePortfolioAllocatorRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  int64 rebalance_interval = 3;     // seconds between rebalances (default 300)
  double min_rebalance_pct = 4;     // minimum deviation to trigger rebalance (default 0.05)
}

message CreatePortfolioAllocatorResponse {
  PortfolioAllocator allocator = 1;
}

// UpdatePortfolioAllocator - updates allocator settings (all fields optional)
message UpdatePortfolioAllocatorRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
  google.protobuf.BoolValue enabled = 3;
  google.protobuf.Int64Value rebalance_interval = 4;
  google.protobuf.DoubleValue min_rebalance_pct = 5;
}

message UpdatePortfolioAllocatorResponse {
  PortfolioAllocator allocator = 1;
}

// DeletePortfolioAllocator - deletes an allocator and all its sources
message DeletePortfolioAllocatorRequest {
  map<string, string> auth_data = 1;
  int64 wallet_id = 2;
}

message DeletePortfolioAllocatorResponse {
}

// ============== Portfolio Source CRUD ==============

// CreatePortfolioSource - adds a new source to an allocator
message CreatePortfolioSourceRequest {
  map<string, string> auth_data = 1;
  int64 allocator_id = 2;
  string name = 3;                    // unique name within allocator
  string source_type = 4;             // "copy_trading" or "discretionary"
  double weight = 5;                  // leverage contribution
  google.protobuf.Struct config = 6;  // source-specific config
}

message CreatePortfolioSourceResponse {
  PortfolioSource source = 1;
}

// UpdatePortfolioSource - updates source settings (all fields optional except identifiers)
message UpdatePortfolioSourceRequest {
  map<string, string> auth_data = 1;
  int64 allocator_id = 2;
  string name = 3;                              // identifies the source to update
  google.protobuf.DoubleValue weight = 4;       // new weight
  google.protobuf.Struct config = 5;            // new config (replaces existing)
  google.protobuf.BoolValue enabled = 6;        // enable/disable source
}

message UpdatePortfolioSourceResponse {
  PortfolioSource source = 1;
}

// DeletePortfolioSource - removes a source from an allocator
message DeletePortfolioSourceRequest {
  map<string, string> auth_data = 1;
  int64 allocator_id = 2;
  string name = 3;                    // identifies the source to delete
}

message DeletePortfolioSourceResponse {
}


service Telegram {
  rpc TelegramUser (TelegramUserRequest) returns (TelegramUserResponse) {}
  rpc TelegramAuthExchange (TelegramAuthExchangeRequest) returns (TelegramAuthExchangeResponse) {}
  rpc TelegramUserWallets (TelegramUserWalletsRequest) returns (TelegramUserWalletsResponse) {}
  rpc HyperliquidMostTrackedWallets (HyperliquidMostTrackedWalletsRequest) returns (HyperliquidMostTrackedWalletsResponse) {}

  // Launch
  rpc HyperliquidLaunchTrade (HyperliquidLaunchTradeRequest) returns (HyperliquidLaunchTradeResponse) {}
  rpc LaunchHyperliquidLaunch (LaunchHyperliquidLaunchRequest) returns (LaunchHyperliquidLaunchResponse) {}
  rpc EditHyperliquidLaunch (EditHyperliquidLaunchRequest) returns (EditHyperliquidLaunchResponse) {}

  // HpumpV1
  rpc HpumpV1LaunchTrade (HpumpV1LaunchTradeRequest) returns (HpumpV1LaunchTradeResponse) {}
  rpc LaunchHpumpV1Launch (LaunchHpumpV1LaunchRequest) returns (LaunchHpumpV1LaunchResponse) {}

  // Core
  rpc HyperliquidCoreAction (HyperliquidCoreActionRequest) returns (HyperliquidCoreActionResponse) {}

  // Spot
  rpc HyperliquidSpotTrade (HyperliquidSpotTradeRequest) returns (HyperliquidSpotTradeResponse) {}
  rpc HyperliquidCoreTrade (HyperliquidCoreTradeRequest) returns (HyperliquidCoreTradeResponse) {}
  rpc HyperliquidCoreCancelOrders (HyperliquidCoreCancelOrdersRequest) returns (HyperliquidCoreCancelOrdersResponse) {}

  // Sessions
  rpc HyperliquidWalletSpotTwapSessions (HyperliquidWalletSpotTwapSessionsRequest) returns (HyperliquidWalletSpotTwapSessionsResponse) {}
  rpc HyperliquidWalletTwapSessions (HyperliquidWalletTwapSessionsRequest) returns (HyperliquidWalletTwapSessionsResponse) {}
  rpc HyperliquidWalletScaleSessions (HyperliquidWalletScaleSessionsRequest) returns (HyperliquidWalletScaleSessionsResponse) {}

  rpc HyperliquidTwapCreate (HyperliquidTwapCreateRequest) returns (HyperliquidTwapCreateResponse) {}
  rpc HyperliquidTwapModify (HyperliquidTwapModifyRequest) returns (HyperliquidTwapModifyResponse) {}
  rpc HyperliquidTwapCancel (HyperliquidTwapCancelRequest) returns (HyperliquidTwapCancelResponse) {}
  rpc HyperliquidScaleCreate (HyperliquidScaleCreateRequest) returns (HyperliquidScaleCreateResponse) {}
  rpc HyperliquidScaleCancel (HyperliquidScaleCancelRequest) returns (HyperliquidScaleCancelResponse) {}

  rpc HyperliquidSpotSniperConfigs (HyperliquidSpotSniperConfigsRequest) returns (HyperliquidSpotSniperConfigsResponse) {}
  rpc CreateHyperliquidSpotSniperConfig (CreateHyperliquidSpotSniperConfigRequest) returns (CreateHyperliquidSpotSniperConfigResponse) {}
  rpc DeleteHyperliquidSpotSniperConfig (DeleteHyperliquidSpotSniperConfigRequest) returns (DeleteHyperliquidSpotSniperConfigResponse) {}
  rpc UpdateHyperliquidSpotSniperConfig (UpdateHyperliquidSpotSniperConfigRequest) returns (UpdateHyperliquidSpotSniperConfigResponse) {}

  rpc HyperliquidWalletCreate (HyperliquidWalletCreateRequest) returns (HyperliquidWalletCreateResponse) {}
  rpc HyperliquidWalletDelete (HyperliquidWalletDeleteRequest) returns (HyperliquidWalletDeleteResponse) {}
  rpc HyperliquidWalletSetPublic (HyperliquidWalletSetPublicRequest) returns (HyperliquidWalletSetPublicResponse) {}
  rpc HyperliquidAgentSignatureCreate (HyperliquidAgentSignatureCreateRequest) returns (HyperliquidAgentSignatureCreateResponse) {}
  rpc HyperliquidAgentWalletCreate (HyperliquidAgentWalletCreateRequest) returns (HyperliquidAgentWalletCreateResponse) {}

  // Cabal
  rpc HfunCabalAlerts (HfunCabalAlertsRequest) returns (stream HfunCabalAlertsResponse) {}
  rpc TelegramChatWalletPackCreate (TelegramChatWalletPackCreateRequest) returns (TelegramChatWalletPackCreateResponse) {}
  rpc TelegramChatWalletPackRename (TelegramChatWalletPackRenameRequest) returns (TelegramChatWalletPackRenameResponse) {}
  rpc TelegramChatWalletPackLabelAdd (TelegramChatWalletPackLabelAddRequest) returns (TelegramChatWalletPackLabelAddResponse) {}
  rpc TelegramChatWalletPackLabelModify (TelegramChatWalletPackLabelModifyRequest) returns (TelegramChatWalletPackLabelModifyResponse) {}
  rpc TelegramChatWalletPackLabelRemove (TelegramChatWalletPackLabelDeleteRequest) returns (TelegramChatWalletPackLabelDeleteResponse) {}

  // Support
  rpc SupportConversationStart(SupportConversationStartRequest) returns (SupportConversationStartResponse);
  rpc SupportMessageSend(SupportMessageSendRequest) returns (SupportMessageSendResponse);
  rpc SupportConversationHistory(SupportConversationHistoryRequest) returns (SupportConversationHistoryResponse);
  rpc SupportConversationList(SupportConversationListRequest) returns (SupportConversationListResponse);
  rpc SupportConversationClose(SupportConversationCloseRequest) returns (SupportConversationCloseResponse);
  rpc SupportTicketStatus(SupportTicketStatusRequest) returns (SupportTicketStatusResponse);

  // Portfolio
  rpc GetPortfolioAllocator(GetPortfolioAllocatorRequest) returns (GetPortfolioAllocatorResponse) {}
  rpc ListPortfolioAllocators(ListPortfolioAllocatorsRequest) returns (ListPortfolioAllocatorsResponse) {}
  rpc ListEnabledPortfolioAllocators(ListEnabledPortfolioAllocatorsRequest) returns (ListEnabledPortfolioAllocatorsResponse) {}
  rpc GetPortfolioSource(GetPortfolioSourceRequest) returns (GetPortfolioSourceResponse) {}
  rpc ListPortfolioSources(ListPortfolioSourcesRequest) returns (ListPortfolioSourcesResponse) {}
  rpc CreatePortfolioAllocator(CreatePortfolioAllocatorRequest) returns (CreatePortfolioAllocatorResponse) {}
  rpc UpdatePortfolioAllocator(UpdatePortfolioAllocatorRequest) returns (UpdatePortfolioAllocatorResponse) {}
  rpc DeletePortfolioAllocator(DeletePortfolioAllocatorRequest) returns (DeletePortfolioAllocatorResponse) {}
  rpc CreatePortfolioSource(CreatePortfolioSourceRequest) returns (CreatePortfolioSourceResponse) {}
  rpc UpdatePortfolioSource(UpdatePortfolioSourceRequest) returns (UpdatePortfolioSourceResponse) {}
  rpc DeletePortfolioSource(DeletePortfolioSourceRequest) returns (DeletePortfolioSourceResponse) {}
}
