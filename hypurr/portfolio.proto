syntax = "proto3";
package hypurr;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr";
import "google/protobuf/struct.proto";

message PortfolioAllocator {
  int64 id = 1;
  int64 telegram_id = 2;
  int64 wallet_id = 3;
  double total_leverage = 4;        // Computed: sum of all enabled source weights
  int64 rebalance_interval = 5;     // Seconds between rebalances
  double min_rebalance_pct = 6;     // Minimum weight deviation to trigger rebalance (e.g., 0.05 = 5%)
  bool enabled = 7;
  repeated PortfolioSource sources = 8;
}

// PortfolioSource represents a weight source configuration
message PortfolioSource {
  int64 id = 1;
  int64 allocator_id = 2;
  string name = 3;                  // Unique name within allocator
  string source_type = 4;           // "copy_trading" or "discretionary"
  double weight = 5;                // Leverage contribution for this source
  google.protobuf.Struct config = 6; // Source-specific config (JSONB)
  bool enabled = 7;
}
