syntax = "proto3";
package hypurr;
option go_package = "gitlab.com/hypurr/hypurr-grpc/go/hypurr";
import "google/protobuf/struct.proto";

message PortfolioAllocator {
  int64 id = 1;
  int64 telegram_id = 2;
  int64 wallet_id = 3;
  double total_leverage = 4;        // Computed: sum of all enabled source weights
  int64 rebalance_interval = 5;     // Seconds between rebalances
  double min_rebalance_pct = 6;     // Minimum weight deviation to trigger rebalance (e.g., 0.05 = 5%)
  bool enabled = 7;
  repeated PortfolioSource sources = 8;
}

// PortfolioSource is a shared source attached to one allocator: the
// attachment's name, weight and enabled flag are per allocator, while
// source_type and config are read from the shared source (source_id), so
// every allocator attached to it follows the same signal.
message PortfolioSource {
  int64 id = 1;                     // Attachment id
  int64 allocator_id = 2;
  string name = 3;                  // Unique name within allocator
  string source_type = 4;           // "copy_trading" or "discretionary" (from the shared source)
  double weight = 5;                // Leverage contribution for this source
  google.protobuf.Struct config = 6; // Source-specific config (JSONB, from the shared source)
  bool enabled = 7;
  int64 source_id = 8;              // PortfolioSharedSource.id
  int64 wallet_id = 9;              // Wallet of the allocator, when known
}

// PortfolioSharedSource is a user-owned source definition that any number of
// the user's allocators can attach. Updating its config moves every attached
// allocator on its next rebalance.
message PortfolioSharedSource {
  int64 id = 1;
  string name = 2;                   // Unique per user
  string source_type = 3;            // "copy_trading" or "discretionary"
  google.protobuf.Struct config = 4; // Source-specific config (JSONB)
  repeated PortfolioSource attachments = 5; // Allocators this source feeds
}

// ============== Weight history & backtest ==============

// PortfolioWeightKind tells a recorded weight apart from a research series.
enum PortfolioWeightKind {
  PORTFOLIO_WEIGHT_KIND_UNSPECIFIED = 0;
  PORTFOLIO_WEIGHT_KIND_LIVE = 1;      // recorded by the portfolio runner from the live source
  PORTFOLIO_WEIGHT_KIND_BACKTEST = 2;  // pushed by the source's author, generated by a backtest
}

// PortfolioWeightSnapshot is a complete target: every pair the source holds at
// ts. A pair missing from weights is flat.
message PortfolioWeightSnapshot {
  int64 ts = 1;                  // unix milliseconds
  map<int64, double> weights = 2; // pair_id -> signed fraction of portfolio margin
}

// PortfolioBacktestLeg is one source of a simulated portfolio: its unscaled
// weights times weight, like an allocator attachment.
message PortfolioBacktestLeg {
  int64 source_id = 1;           // PortfolioSharedSource.id
  double weight = 2;             // multiplier (attachment weight); 0 = 1
}

// PortfolioBacktestMode picks which recorded weights a backtest replays.
enum PortfolioBacktestMode {
  PORTFOLIO_BACKTEST_MODE_BLENDED = 0;  // backtest series until a source went live, live weights after
  PORTFOLIO_BACKTEST_MODE_LIVE = 1;     // live weights only
  PORTFOLIO_BACKTEST_MODE_BACKTEST = 2; // backtest series only, also over the live period (to compare)
}

enum PortfolioBacktestResolution {
  PORTFOLIO_BACKTEST_RESOLUTION_AUTO = 0; // hourly up to 90 days, daily beyond
  PORTFOLIO_BACKTEST_RESOLUTION_HOUR = 1;
  PORTFOLIO_BACKTEST_RESOLUTION_DAY = 2;
}

// PortfolioBacktestSeries is columnar: every array has one value per ts.
// Returns compound hourly; costs are charged on the turnover of the combined
// book, so offsetting trades between legs net out.
message PortfolioBacktestSeries {
  repeated int64 ts = 1;         // unix seconds, end of each period
  repeated double equity = 2;    // growth of 1, net of costs
  repeated double drawdown = 3;  // equity / running max - 1 (<= 0)
  repeated double gross = 4;     // sum |weight| at the end of the period
  repeated double net = 5;       // sum weight at the end of the period
  repeated double turnover = 6;  // sum |weight change| during the period
}

message PortfolioBacktestMonthlyReturn {
  int32 year = 1;
  int32 month = 2;               // 1-12
  double ret = 3;
}

// PortfolioBacktestStats are computed on daily returns; annualised with 365
// days (perps trade every day).
message PortfolioBacktestStats {
  double total_return = 1;
  double annualized_return = 2;
  double annualized_volatility = 3;
  double sharpe = 4;
  double sortino = 5;
  double max_drawdown = 6;       // <= 0
  int64 max_drawdown_days = 7;   // longest time under water, days
  double calmar = 8;
  double beta = 9;               // vs the benchmark
  double alpha = 10;             // annualised, vs the benchmark
  double var_95 = 11;            // 1-day historical VaR, a loss is negative
  double best_day = 12;
  double worst_day = 13;
  double positive_days = 14;     // fraction of days with a positive return
  double avg_gross = 15;         // mean sum |weight|
  double avg_daily_turnover = 16;
  double total_costs = 17;       // sum of cost fractions charged
  int64 days = 18;
  repeated PortfolioBacktestMonthlyReturn monthly = 19;
}

// PortfolioBacktestTracking compares a source's live weights with its backtest
// series over the hours both exist: does live follow the research?
message PortfolioBacktestTracking {
  int64 from = 1;                    // unix seconds, first boundary of the overlap
  int64 to = 2;
  int64 hours = 3;                   // boundaries where both have a target
  double mean_abs_weight_diff = 4;   // mean sum |live - backtest| per boundary
  double live_return = 5;            // compounded over the overlap, net of costs
  double backtest_return = 6;
  double correlation = 7;            // of daily returns
  double tracking_error = 8;         // annualised std of daily return differences
}

// PortfolioBacktestLegResult is one source replayed on its own (weight 1).
message PortfolioBacktestLegResult {
  int64 source_id = 1;
  string name = 2;
  double weight = 3;
  int64 backtest_from = 4;       // unix seconds; 0 when the source has no backtest series
  int64 backtest_to = 5;
  int64 live_from = 6;           // unix seconds; 0 when the source has no live history
  int64 live_to = 7;
  PortfolioBacktestSeries series = 8;
  PortfolioBacktestStats stats = 9;
  PortfolioBacktestTracking tracking = 10; // unset when live and backtest never overlap
}
